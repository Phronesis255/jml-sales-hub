 constraint list"], "gate": "Every recommendation traces to evidence or is labeled a hypothesis.", "rework": "Insufficient evidence → collect missing data or label the limitation.", "tools": [{"label": "Social Media Intelligence", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/intelligence.html", "use": "Existing brand, strategy, evidence and reporting prototype"}, {"label": "Ad Intelligence", "url": "https://biocool.github.io/jml-sales-hub/ad-intelligence/", "use": "Source-backed inspiration and competitor research, not performance proof"}, {"label": "Prompt Source Library", "url": "https://biocool.github.io/jml-image-prompt-gallery/#source-library", "use": "Visual references and source provenance; check rights before reuse"}], "next": "strategy", "reworkTarget": "onboard"}, {"id": "strategy", "number": 3, "title": "Set strategy & measurement", "phase": "Foundation", "owner": "Social Media Strategist", "approver": "Client Owner", "inputs": ["Audit and business priorities", "Available capacity and budget"], "actions": ["Define each platform’s job, audience, pillars, funnel role and primary goal", "Agree KPI definitions, measurement sources, baseline, timeframe and reporting cadence", "Define relevant-audience growth goals, value proposition, discovery routes and the client-owned community plan; do not optimize for follower count alone."], "outputs": ["Versioned strategy and KPI plan", "Channel and content priorities"], "gate": "Client approves direction and scope before detailed production planning.", "rework": "Strategy declined → revise goals, audience or approach, then re-approve.", "tools": [{"label": "Social Media Marketing Playbook", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/playbook.html", "use": "Lifecycle, handoffs and operating standards"}, {"label": "Social Media Intelligence", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/intelligence.html", "use": "Existing brand, strategy, evidence and reporting prototype"}, {"label": "Content Calendar Field Guide", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/Content_Calendar__.html", "use": "Calendar fields, format-specific production packages and measurement rules"}], "next": "calendar", "reworkTarget": "research"}, {"id": "calendar", "number": 4, "title": "Plan & approve calendar", "phase": "Planning", "owner": "Content Operations Manager", "approver": "Client Owner", "inputs": ["Approved strategy", "Campaign dates, holidays and production capacity"], "actions": ["Turn pillars into topics, formats, hooks, CTAs and channel-specific treatments", "Assign owner, publish date/time/timezone, draft deadline and approval deadline"], "outputs": ["Approved calendar version", "Capacity-checked batch and dependencies"], "gate": "Calendar is approved and each item has an accountable owner and realistic deadline.", "rework": "Calendar changes → revise affected briefs and reconfirm dates.", "tools": [{"label": "Content Planner", "url": "https://biocool.github.io/jml-sales-hub/content-planner.html", "use": "Calendar, campaign, ownership and review workspace"}, {"label": "Content Calendar Field Guide", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/Content_Calendar__.html", "use": "Calendar fields, format-specific production packages and measurement rules"}], "next": "brief", "reworkTarget": "strategy"}, {"id": "brief", "number": 5, "title": "Brief & prepare production", "phase": "Planning", "owner": "Content Strategist / Copywriter", "approver": "Content Operations Manager", "inputs": ["Approved calendar items", "Brand guidelines and required media"], "actions": ["Define one message, audience, hook, script/copy, CTA and destination", "Select a proportional package: creative brief, shot list/storyboard, art/layout direction as needed"], "outputs": ["Production-ready brief and asset links", "Acceptance checklist and media request"], "gate": "Creator can execute without guessing; missing footage or claims are flagged.", "rework": "Incomplete brief → return to planning or request missing assets.", "tools": [{"label": "Creative Brief Studio", "url": "https://biocool.github.io/jml-sales-hub/creative-brief/", "use": "Strategy, message, production and handoff brief"}, {"label": "Content Calendar Field Guide", "url": "https://biocool.github.io/jml-sales-hub/social-content-os/Content_Calendar__.html", "use": "Calendar fields, format-specific production packages and measurement rules"}, {"label": "Prompt Source Library", "url": "https://biocool.github.io/jml-image-prompt-gallery/#source-library", "use": "Visual references and source provenance; check rights before reuse"}], "next": "produce", "reworkTarget": "calendar"}, {"id": "produce", "number": 6, "title": "Create the content batch", "phase": "Execution", "owner": "Designer / Video Editor / Copywriter", "approver": "Creative Lead", "inputs": ["Approved brief", "Licensed/owned assets and factual source material"], "actions": ["Write copy and create channel-specific visuals, video, subtitles and thumbnails", "Version drafts; keep editable sources and export specifications together"], "outputs": ["Draft assets and copy", "Versioned production package"], "gate": "Draft matches the brief and all required variants are included.", "rework": "Production blocker → clarify brief or renegotiate the calendar, not skip review.", "tools": [{"label": "Creative Brief Studio", "url": "https://biocool.github.io/jml-sales-hub/creative-brief/", "use": "Strategy, message, production and handoff brief"}, {"label": "Prompt Source Library", "url": "https://biocool.github.io/jml-image-prompt-gallery/#source-library", "use": "Visual references and source provenance; check rights before reuse"}, {"label": "Content Planner", "url": "https://biocool.github.io/jml-sales-hub/content-planner.html", "use": "Calendar, campaign, ownership and review workspace"}], "next": "qa", "reworkTarget": "brief"}, {"id": "qa", "number": 7, "title": "Inte let flowSelected='onboard',flowRole='all';
function flowIndex(id){return workflow.stages.findIndex(x=>x.id===id)}
function flowSelect(id,focus=false){if(flowIndex(id)<0)return;flowSelected=id;document.getElementById('flowTrack').innerHTML=flowTrack();document.getElementById('flowDetail').innerHTML=flowDetail();if(focus||innerWidth<951){document.getElementById('flowDetail').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('flowDetail').focus({preventScroll:true})}}
function flowTrack(){const role=workflow.roles.find(x=>x.title===flowRole);return workflow.stages.map((s,i)=>`<li class="flow-step"><button class="flow-node ${flowSelected===s.id?'selected':''} ${['strategy','calendar','qa','approve'].includes(s.id)?'gate':''} ${role&&!role.owns.includes(s.id)?'dim':''}" aria-pressed="${flowSelected===s.id}" aria-controls="flowDetail" onclick="flowSelect('${s.id}')"><span class="step-number">${String(i+1).padStart(2,'0')}</span><span><span class="stage-phase">${esc(s.phase)}${s.parallel?' · always-on':''}</span><b>${esc(s.title)}</b><small>${esc(s.owner)}</small></span></button></li>`).join('')}
function flowList(items){return '<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function flowDetail(){const s=workflow.stages[flowIndex(flowSelected)],i=flowIndex(s.id),prev=workflow.stages[i-1],next=workflow.stages.find(x=>x.id===s.next),back=workflow.stages.find(x=>x.id===s.reworkTarget);return `<div class="eyebrow">STEP ${String(i+1).padStart(2,'0')} / ${esc(s.phase)}</div><h2>${esc(s.title)}</h2><span class="tag new">Proposed responsibility</span><div class="flow-meta"><div><span>Delivery owner</span><b>${esc(s.owner)}</b></div><div><span>Decision / approval owner</span><b>${esc(s.approver)}</b></div></div><h3>What comes in</h3>${flowList(s.inputs)}<h3>What happens here</h3>${flowList(s.actions)}<h3>What goes to the next owner</h3>${flowList(s.outputs)}<h3>Ready-to-advance gate</h3><div class="flow-gate">${esc(s.gate)}</div><h3>If it is not ready</h3><p>${esc(s.rework)}</p><h3>Existing JML tools & references</h3><div class="flow-tools">${s.tools.map(t=>`<a href="${esc(t.url)}" target="_blank" rel="noopener" title="${esc(t.use)}">${esc(t.label)} ↗</a>`).join('')}</div><p class="mini">Links open separate tools. Data is not synchronized; no live approval or publishing occurs here.</p><div class="flow-route">${prev?`<button onclick="flowSelect('${prev.id}',true)">← Previous</button>`:''}${next?`<button class="primary" onclick="flowSelect('${next.id}',true)">${i===workflow.stages.length-1?'Loop back':'Next handoff'} → ${esc(next.title)}</button>`:''}${back?`<button onclick="flowSelect('${back.id}',true)">↶ Rework: ${esc(back.title)}</button>`:''}</div>`}
function flowRoleChange(value){flowRole=value;document.getElementById('flowTrack').innerHTML=flowTrack();document.getElementById('flowRoleNote').textContent=value==='all'?'All stages shown in sequence. Select a step to inspect its handoff.':'Highlighted stages involve '+value+'. Other stages stay visible so handoffs remain clear.'}
function workflowView(){return `<section class="flow-hero"><div><span class="tag">PROPOSED OPERATING MODEL</span><h2>From a new client<br>to the next growth decision.</h2><p>Follow the handoffs, inspect the approval gates, and loop evidence back into the plan. Not just a content production checklist.</p></div><div class="flow-count"><div class="flow-total">${workflow.stages.length}</div><span>connected stages</span></div></section><div class="flow-toolbar"><label>Highlight a proposed role<select onchange="flowRoleChange(this.value)"><option value="all">All responsibilities</option>${workflow.roles.map(r=>`<option ${flowRole===r.title?'selected':''}>${esc(r.title)}</option>`).join('')}</select></label><button onclick="go('team')">Roles & responsibility matrix →</button><button onclick="go('growth')">Growth & KPI loop →</button><button onclick="go('capabilities')">Tool gaps & priorities →</button></div><p id="flowRoleNote" class="mini">${flowRole==='all'?'All stages shown in sequence. Select a step to inspect its handoff.':'Highlighted stages involve '+esc(flowRole)+'. Other stages stay visible.'}</p><div class="flow-legend"><span>↓ Ordered handoff</span><span>▌ Lime edge = approval / QA gate</span><span>↶ Rework route in each step</span></div><div class="flow-layout"><ol class="flow-track" id="flowTrack">${flowTrack()}</ol><section class="flow-detail" id="flowDetail" tabindex="-1" aria-live="polite">${flowDetail()}</section></div><div class="flow-summary"><b>Always-on growth lane:</b> relevant discovery → useful interaction → collaborations → qualified action → evidence → next experiment. Community ownership stays with the client unless a separate agency scope is agreed.</div><div class="cards" style="margin-top:22px">${workflow.cadence.map(c=>panel(c.period,'<p>'+esc(c.focus)+'</p>')).join('')}</div><p class="mini">${esc(workflow.notice)}</p>`}
function roleMatrixView(){return panel('Suggested titles, not staffing decisions',`<p>These are responsibilities to assign, not nine mandatory hires. A small team can combine roles, but should keep a named client approver and a second-person quality check for consequential claims.</p><div class="role-cards">${workflow.roles.map(r=>`<article class="role-card"><h3>${esc(r.title)}</h3><p>${esc(r.responsibility)}</p><p class="mini"><b>Boundary:</b> ${esc(r.boundary)}</p><div class="flow-tools">${r.owns.map(id=>{let s=workflow.stages.find(s=>s.id===id);return s?`<button onclick="flowSelected='${id}';go('model')">${esc(s.title)} →</button>`:''}).join('')}</div></article>`).join('')}</div>`)+panel('Assignment rules','<ul><li>One delivery owner and one decision owner per item, identified before work starts.</li><li>Calendar approval and creative approval are different gates.</li><li>An edit to approved copy or assets requires re-approval of the changed version.</li><li>Client community management remains the default. Agency replies, DMs, outreach and collaborations need a scoped service and escalation rules.</li><li>No role selector in this prototype creates security permissions or assigns real people.</li></ul>')}
function growthView(){return panel('Growth is a parallel operating loop',`<p>Build a relevant audience and meaningful demand, not just a larger follower count. Define the business outcome first, then select channels and growth tactics.</p><div class="steps"><span>Discover the right audience</span><span>Earn attention</span><span>Start useful conversations</span><span>Collaborate</span><span>Convert qualified interest</span><span>Learn & repeat</span></div><div class="cards">${[['Relevant discovery','Audience questions, searchable topics, profile clarity, location context and shareable education. Match each channel to the people it can actually reach.'],['Community & engagement','Respond helpfully, use question-led content, collect recurring objections and route service issues. Default owner: client. JML can support only under an agreed scope.'],['Partnerships & amplification','Identify aligned creators, local partners and customer stories. Review audience fit, rights and disclosures before outreach or reuse. Paid amplification is a separate budget decision.']].map(x=>panel(x[0],'<p>'+x[1]+'</p>')).join('')}</div>`)+panel('Choose KPIs by objective',`<div class="tablewrap"><table><thead><tr><th>Objective</th><th>Primary evidence</th><th>Useful diagnostic</th><th>Guardrail</th></tr></thead><tbody>${[['Relevant awareness','Reach within the intended audience, where platform data supports it','Non-follower reach, qualified profile visits, video retention','Do not claim demographic fit when the platform cannot establish it.'],['Community depth','Meaningful interactions and qualified conversations','Saves/reach, shares/reach, response rate and response time','Define engagements and denominator; bots or giveaways can distort growth.'],['Consideration','Tracked website actions or qualified inquiries','Link clicks, landing engagement, inquiry quality','A click is not a lead. Record tracking gaps and actual source.'],['Business outcomes','Verified qualified leads, bookings or revenue where attributable','Lead-to-booking rate, acquisition cost when spend is known','Distinguish directly attributed, influenced, correlated and unknown.'],['Audience health','Net growth alongside relevant audience and retention signals','Follows, unfollows, returning viewers where available','No bought followers, mass unsolicited DMs or guaranteed growth.']].map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`)+panel('Weekly growth experiment',`<ol><li><b>Hypothesis:</b> state the audience behavior and reason for the test.</li><li><b>One main change:</b> hook, format, topic, collaboration or CTA. Keep other factors as comparable as practical.</li><li><b>Measure:</b> predefine source, primary KPI, baseline, observation window and minimum useful evidence.</li><li><b>Review:</b> separate the observation from an explanation. Normal post comparisons are not controlled experiments.</li><li><b>Decide:</b> continue, improve, test again or retire. Record owner and next review date.</li></ol><button class="primary" onclick="flowSelected='optimize';go('model')">Return to the optimization handoff →</button><p class="mini">No targets or performance figures here are claimed as client results. Paid spend, external outreach and account access are not authorized by this diagram.</p>`)}

if(view==='resources'){html+=`<div class="two">${panel('Existing tools · open source pages',sources.map(x=>`<a class="source-link" href="${x[2]}" target="_blank" rel="noopener"><b>${x[0]} ↗</b><span class="mini">${x[1]}</span></a>`).join(''))}${panel('Local research & repository','<h3><button class="source-title" onclick="go(\'intelligence\')">jml-social-media-intelligence →</button></h3><p>Intelligence foundation: listening, strategy, calendars, performance, learning, recommendations and human decisions.</p><span class="tag new">Original prototype hosted separately</span><p class="mini">Open the original command center for its existing brand, calendar, strategy, evidence and reporting workflows. Its browser-local records are separate from the proposed execution mock.</p><hr><p><button class="source-title" onclick="openPlaybook()">JML-Social-Media-Marketing-Playbook.html →</button><br><span class="mini">Lifecycle backbone: intake → strategy → calendar approval → production → creative approval → verified publishing → weekly learning → monthly reporting.</span></p><p><a class="source-title" href="./Content_Calendar__.html" target="_blank" rel="noopener">Content Calendar Field Guide →</a><br><span class="mini">Original bilingual 16-chapter guide. Its calendar field model, format-dependent briefs and measurement rules inform the planning, production and results sections below.</span></p>')}</div><div class="callout"><b>R&D is a supporting layer.</b> An interesting ad or visual reference is not proof that a client’s content will perform. Record source, rights, hypothesis and relevance before reuse.</div>`}
if(view==='team'){html+=roleMatrixView()}

if(view==='plan'){html+=panel('Calendar field model · from the Field Guide',`<p>Strategy explains <b>why</b>; the content plan chooses themes, campaigns and formats; the calendar assigns timing, responsibility and workflow. Keep pillar, funnel stage and format separate.</p><div class="tablewrap"><table><thead><tr><th>Field group</th><th>Required design coverage</th></tr></thead><tbody><tr><td>Identity & schedule</td><td>Stable post ID, brand, campaign, publish date/time/time zone, platform, format</td></tr><tr><td>Strategy</td><td>Audience, one primary goal, KPI, pillar, funnel stage, topic</td></tr><tr><td>Copy & production</td><td>Hook, body/script, on-screen text, caption, CTA, destination, visual direction, brief link, asset link</td></tr><tr><td>Ownership & dependencies</td><td>Owner, shoot date, draft due, approval deadline, status, review notes, required media</td></tr><tr><td>Results & refresh</td><td>Verified published URL, metric source/window, results, learning, next action, last/next review date</td></tr></tbody></table></div><p class="mini">This is the proposed field contract; the simplified demo editor does not yet persist every field. Do not turn illustrative content-mix percentages into universal targets.</p><a href="./Content_Calendar__.html" target="_blank" rel="noopener">Read the original field guide ↗</a>`)}
if(view==='production'){html+=panel('Choose the right production package',`<p>Use only the documentation the asset needs. These are recommendations, not eleven mandatory sequential documents.</p><label class="field" for="briefFormat">Content format / complexity</label><select id="briefFormat" onchange="renderBriefPackage()"><option>Static Post</option><option>Carousel</option><option>Infographic</option><option>Static Story</option><option>Video Story</option><option>Simple Reel</option><option>Complex Video</option><option>Multi-channel Campaign</option><option>Blog / SEO Article</option></select><div id="briefPackage" class="callout">${briefPackage('Static Post')}</div><p class="mini">Creative brief = why, audience and message. Production brief = execution resources and timing. Art direction = visual character. Layout direction = exact hierarchy and placement.</p><p class="mini">Keep raw recording duration separate from final edit duration. Review safe zones, contrast, captions, permissions and actual phone-size readability before approval.</p><a href="./Content_Calendar__.html" target="_blank" rel="noopener">Read the complete production guidance ↗</a>`)}
if(view==='insights'){html+=panel('Measurement rules · from the Field Guide',`<ul><li>Use the actual reporting period, not an interchangeable “last 30 days.”</li><li>Record platform/source, coverage and metric definitions. A calendar does not generate analytics.</li><li>Engagement rate by reach = engagements ÷ reach × 100. State the denominator; missing or zero reach does not produce a valid rate.</li><li>GBP metrics generally describe the whole profile, not necessarily an individual post.</li><li>Search Console measures search visibility; GA4 measures configured website behavior. Neither is connected here.</li><li>Two posts under different conditions are not automatically a controlled A/B test. Treat findings as hypotheses until supported.</li></ul><p>After review, choose continue, improve, test or retire; record a next action and refresh date rather than only changing the publication date.</p>`)}
document.getElementById('main').innerHTML=`<div class="view">${html}<div class="foot">JML Social Content OS · Workflow & growth model v2 · Source-informed architecture + proposed operational modules · No external actions</div></div>`}
function refreshTable(){document.getElementById('contentTable').innerHTML=table(selected().filter(x=>(!filter||x.status===filter)&&x.title.toLowerCase().includes(search.toLowerCase())))}
function show(html){let d=document.getElementById('dialog');d.classList.remove('source-preview');d.innerHTML='<button class="close" onclick="document.getElementById(\'dialog\').close()" aria-label="Close dialog">✕</button>'+html;d.showModal()}function detail(id){let x=data.find(x=>x.id===id);modalItem=id;show(`<div class="eyebrow">${esc(x.brand)} / ${esc(x.channel)}</div><h2>${esc(x.title)}</h2>${badge(x.status)} <span class="tag">Demo record #${x.id}</span><div class="steps">${['Brief','Production','Review','Approved','Scheduled'].map(y=>`<span class="${x.status===y?'on':''}">${y}</span>`).join('')}</div><p><b>Goal:</b> ${x.goal} · <b>Pillar:</b> ${x.pillar}<br><b>Owner:</b> ${x.owner} · <b>Date:</b> ${x.date}</p><h3>Copy preview</h3><p>${esc(x.caption)}</p><div class="callout">${esc(x.note)}</div><label class="field" for="feedback">Review note</label><textarea id="feedback" rows="3" placeholder="Add a concise note for the owner…"></textarea><div class="row" style="margin-top:15px;justify-content:flex-start">${x.status==='Review'?'<button class="primary" onclick="changeStatus(\'Approved\')">Approve demo version</button><button onclick="changeStatus(\'Production\')">Request revision</button>':x.status==='Approved'?'<button class="primary" onclick="schedule()">Schedule in demo</button>':x.status==='Brief'?'<button class="primary" onclick="changeStatus(\'Production\')">Start production</button>':x.status==='Production'?'<button class="primary" onclick="changeStatus(\'Review\')">Send to demo review</button>':'<p class="mini">This item is scheduled only in the local mock.</p>'}</div>`)}
function changeStatus(status){let x=data.find(x=>x.id===modalItem),n=document.getElementById('feedback').value.trim();if(status==='Production'&&x.status==='Review'&&!n){toast('Add a revision note first.');return}x.status=status;if(n)x.note=n;historyLog.unshift(x.title+' → '+status);persist();document.getElementById('dialog').close();render();toast('Demo item updated. No external action.')}
function schedule(){let x=data.find(x=>x.id===modalItem);if(x.status!=='Approved')return toast('Approval is required.');x.status='Scheduled';historyLog.unshift(x.title+' → Demo scheduled');persist();document.getElementById('dialog').close();render();toast('Added to the local demo schedule. Nothing was published.')}
function newItem(){show('<h2>New content brief</h2><p class="mini">Create a demo calendar record. Detailed production briefs remain linked to the existing brief tool.</p><label class="field">Brand</label><select id="newbrand"><option>Nikki Nitro</option><option>MLD Tax</option><option>JML</option></select><label class="field">Content title</label><input id="newtitle" maxlength="100" placeholder="One clear content idea"><label class="field">Channel</label><select id="newchannel"><option>Instagram</option><option>LinkedIn</option></select><label class="field">Planned date</label><input type="date" id="newdate" value="2026-11-24"><label class="field">Primary objective</label><select id="newgoal"><option>Engagement</option><option>Qualified inquiries</option><option>Website visits</option><option>Brand awareness</option></select><button class="primary" style="margin-top:20px" onclick="saveNew()">Create demo brief</button>')}
function saveNew(){let title=document.getElementById('newtitle').value.trim(),date=document.getElementById('newdate').value;if(!title||!date)return toast('Add a title and date.');data.push({id:Math.max(...data.map(x=>x.id))+1,brand:document.getElementById('newbrand').value,title,date,channel:document.getElementById('newchannel').value,goal:document.getElementById('newgoal').value,pillar:'To define',format:'To define',owner:'Strategist',status:'Brief',caption:'Copy not written yet.',note:'Draft brief; strategy and creative checks required.'});persist();document.getElementById('dialog').close();document.getElementById('brand').value='all';render();toast('Demo brief created.')}
function recommend(){let b=document.getElementById('brand').value;data.push({id:Math.max(...data.map(x=>x.id))+1,brand:b==='all'?'Nikki Nitro':b,title:'Experiment: educational carousel',channel:'Instagram',format:'Carousel',pillar:'Education',date:'2026-11-27',owner:'Strategist',status:'Brief',goal:'Engagement',caption:'Proposed test, pending strategy review.',note:'Sample hypothesis from demo metrics. Human decision required before production.'});persist();go('plan');toast('Proposed test added as a draft. Strategy was not changed.')}
function exportData(){let blob=new Blob([JSON.stringify({prototype:true,notice:'Fictional demo records; no external publication',records:selected()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JML-Social-Content-Demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('Reset only the local demo records?')){data=structuredClone(initial);historyLog=[];persist();render();toast('Demo reset.')}}document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});window.addEventListener('hashchange',()=>{let k=location.hash.slice(1);if(titles[k]){view=k;render()}});if(titles[location.hash.slice(1)])view=location.hash.slice(1);render();

function openPlaybook(){window.open('./playbook.html','_blank','noopener')}
function downloadPlaybook(){window.open('./playbook.html','_blank','noopener')}
function launchIntelligence(){window.open('./intelligence.html','_blank','noopener')}

function briefPackage(format){const packages={
'Static Post':['Design Brief + Art Direction','Exact copy, dimensions, subject, lighting, composition and approved final; add a Photography Brief when shooting is required.'],
'Carousel':['Design Brief + slide-by-slide layout','Define each slide’s exact copy and hierarchy, narrative sequence, final CTA and consistent visual direction.'],
'Infographic':['Infographic Design Brief + Layout Direction + exact copy','Verify facts and sources, set information priority, then headline, data blocks, icons and CTA.'],
'Static Story':['Short design brief + layout','Image, short copy, text position, safe zones, CTA and link or interaction.'],
'Video Story':['Short Script + Shot List + editing notes','Specify action, on-screen copy, required footage, pacing and caption needs.'],
'Simple Reel':['Video Script + Shot List + Editing Brief','Specify hook, actions, camera coverage, cuts, licensed audio, on-screen text and export.'],
'Complex Video':['Creative + Production Brief + Script + Storyboard + Shot List + Editing Brief','Coordinate concept, resources, timing, visual sequence, required footage and post-production.'],
'Multi-channel Campaign':['Campaign Brief + Master Calendar + Production Briefs + Measurement Plan','Coordinate the shared goal while adapting every deliverable to its platform.'],
'Blog / SEO Article':['SEO content brief + qualified review','Primary/secondary keywords, search intent, SEO title, meta description, headings, internal links, sources and review dates.']};const p=packages[format]||packages['Static Post'];return '<h3>'+p[0]+'</h3><p>'+p[1]+'</p>'}
function renderBriefPackage(){document.getElementById('briefPackage').innerHTML=briefPackage(document.getElementById('briefFormat').value)}
</script></body></html>

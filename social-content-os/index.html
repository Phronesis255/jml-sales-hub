r(--line);border-radius:30px;background:white;font-size:12px}.source-link{display:block;border-bottom:1px solid var(--line);padding:15px 0;text-decoration:none}.source-link b{display:block}.source-link:last-child{border:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:normal;border-bottom:1px solid var(--line);padding:12px 8px}td{padding:14px 8px;border-bottom:1px solid #eee9f3}td button{padding:5px 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white}input[type=search]{max-width:340px}.pill{font-size:11px;border-radius:20px;background:#eee7f5;padding:5px 9px;white-space:nowrap}.pill.approved{background:#e8f0cd}.pill.review{background:#ffedcd}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.lane{background:#ece7f0;border-radius:12px;padding:12px;min-height:220px}.lane h3{font-family:inherit;font-size:12px;font-weight:bold}.item{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;background:white}.item b{display:block;margin:6px 0}.item small{color:var(--muted)}.empty{padding:22px;color:var(--muted);border:1px dashed #ccbfd7;border-radius:9px}.metric{height:120px;display:flex;gap:10px;align-items:flex-end;margin:16px 0}.metric div{flex:1;background:var(--purple);border-radius:6px 6px 0 0;position:relative;min-width:24px}.metric small{position:absolute;bottom:100%;text-align:center;left:0;width:100%;font-size:10px}.metric .highlight{background:var(--lime)}.callout{padding:15px;border-left:3px solid var(--lime);background:#f8faef;margin:16px 0}.checklist{padding:0;list-style:none}.checklist li{padding:9px 0;border-bottom:1px solid var(--line)}.checklist li:before{content:'✓';color:#709000;margin-right:9px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.steps span{font-size:11px;background:#eee8f4;padding:7px 10px;border- n. It deliberately does not implement creative execution or publishing.</p><button onclick="go(\'resources\')">Explore the source map →</button>')}${panel('What this platform adds','<p>A single operating workspace for production, approvals, publishing handoffs, client reporting and people management.</p><span class="tag new">PROPOSED</span><p class="mini">Navigation and workflows below are a concept, not a claim of working integrations.</p>')}</div>`}
if(view==='intelligence'){html+=`<div class="panel"><div class="row"><div><span class="tag">jml-social-media-intelligence</span><span class="tag warn">Original local-first prototype</span><h2 style="margin-top:12px">The full command center, one click away.</h2></div><button class="primary" onclick="launchIntelligence()">Open original workspace →</button></div><p>Keep the existing architecture: brand-scoped context, role dashboards, campaign and calendar management, strategy, performance evidence, reports and learning. The original application is hosted as a separate page and opens without finding a folder on your Mac.</p><div class="callout">This is a preserved prototype. No real account login, secure role authorization, social-network connection or publishing backend is added. Its sample metrics are not client results. Local demo changes inside it are separate from this portal’s proposed production and publishing records.</div></div><div class="cards">${[['01 / Decisions','Listening → strategy → human decision','Keep evidence and recommendations attached to the brand. New strategy versions require a human decision.'],['02 / Operations','Calendar → creative handoff','Explore the original calendar views and campaign context. The portal adds the proposed production, approval and publishing desk separately.'],['03 / Accountability','Performance → report → next action','Separate attention, engagement, intent and business outcomes. Keep internal, client and portfolio reporting distinct.']].map(x=>panel(x[0],'<h3>'+x[1]+'</h3><p>'+x[2]+'</p>')).join('')}</div><div class="two">${panel('How this fits the system','<ol><li>Use the original command center for brand strategy, planning and intelligence.</li><li>Use Production studio and Approval queue for the proposed execution flow.</li><li>Return verified publication and performance evidence to the learning loop.</li></ol><p class="mini">The shared backend and synchronized content IDs are implementation work, not simulated integrations.</p>')}${panel('Source coverage','<ul><li>Repository prototype: original source hosted separately, not rewritten.</li><li>Marketing playbook: original source hosted separately and linked from R&D.</li><li>Content_Calendar__.html: still unavailable. Its research has not been integrated or claimed as read.</li></ul><button onclick="go(\'resources\')">Source library</button>')}</div>`}

if(view==='publish'){html+=panel('Approved & scheduled',table(s.filter(x=>['Approved','Scheduled'].includes(x.status))))+`<div class="cards">${['Instagram','LinkedIn','Print / offline'].map(x=>`<div class="panel"><h3>${x}</h3><span class="tag warn">${x==='Print / offline'?'Proposed export route':'Not connected'}</span><p class="mini">${x==='Print / offline'?'Generate a versioned production package with dimensions, assets and print checks.':'OAuth, platform permissions, media validation, retry handling and publication receipts are required.'}</p></div>`).join('')}</div><div class="callout">A demo schedule changes only this browser’s records. No post is sent, no account is connected and no print job is created.</div>`}
if(view==='insights'){html+=`<div class="two">${panel('Performance story · fictional sample','<span class="tag warn">Illustrative values, not client results</span><div class="metric">'+[45,65,52,82,70,100].map((n,i)=>`<div style="height:${n}%" class="${i===5?'highlight':''}"><small>${[110,160,130,205,175,250][i]}</small></div>`).join('')+'</div><div class="mini">Example saves across six posts · compare like-for-like windows</div><p>Educational content appears to earn more saves in this sample. Test the pattern before reallocating the calendar.</p>')}${panel('Turn learning into a decision','<span class="tag">Hypothesis</span><h3>Test one more educational carousel</h3><p>Keep the objective and audience stable. Compare saves per reach, not raw saves alone.</p><button class="primary" onclick="recommend()">Create proposed calendar test</button><p class="mini">Creates a local draft, not an automatic strategy overwrite.</p>')}</div>`+panel('Client report outline','<ol><li>Agreed objective and reporting window</li><li>What shipped and what is pending</li><li>Platform metrics with source, window and coverage</li><li>What changed / Why it matters / What to do next</li><li>Attribution: directly attributed, influenced, correlated or unknown</li><li>Decisions needed and next-month changes</li></ol><button onclick="window.print()">Print / save this view as PDF</button>')}
if(view==='resources'){html+=`<div class="two">${panel('Existing tools · open source pages',sources.map(x=>`<a class="source-link" href="${x[2]}" target="_blank" rel="noopener"><b>${x[0]} ↗</b><span class="mini">${x[1]}</span></a>`).join(''))}${panel('Local research & repository','<h3><button class="source-title" onclick="go(\'intelligence\')">jml-social-media-intelligence →</button></h3><p>Intelligence foundation: listening, strategy, calendars, performance, learning, recommendations and human decisions.</p><span class="tag new">Original prototype hosted separately</span><p class="mini">Open the original command center for its existing brand, calendar, strategy, evidence and reporting workflows. Its browser-local records are separate from the proposed execution mock.</p><hr><p><button class="source-title" onclick="openPlaybook()">JML-Social-Media-Marketing-Playbook.html →</button><br><span class="mini">Lifecycle backbone: intake → strategy → calendar approval → production → creative approval → verified publishing → weekly learning → monthly reporting.</span></p><p><b>Content_Calendar__.html · source unavailable</b><br><span class="mini">The referenced file could not be recovered. Its contents are not integrated; attach the HTML to complete this source.</span></p>')}</div><div class="callout"><b>R&D is a supporting layer.</b> An interesting ad or visual reference is not proof that a client’s content will perform. Record source, rights, hypothesis and relevance before reuse.</div>`}
if(view==='team'){let roles=[['Agency manager','Portfolio health, capacity, delivery and approvals'],['Strategist','Brand goals, audience, pillars and strategy proposals'],['Creator','Assigned briefs, assets and revision requests'],['Publisher','Approved versions, schedule and publication receipts'],['Analyst','Metrics provenance, evidence and recommendations'],['Client reviewer','Own brand’s review queue, reports and decisions']];html+=panel('Responsibilities before permissions',`<table><thead><tr><th>Role</th><th>Primary responsibility</th></tr></thead><tbody>${roles.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`)+`<div class="two">${panel('Non-negotiable boundaries','<ul class="checklist"><li>Brand-scoped data and asset access</li><li>Named approver for every release</li><li>No fabricated ROI or attribution</li><li>Source and consent tracking</li><li>Versioned strategies and decisions</li><li>Audit history for meaningful changes</li></ul>')}${panel('Demo workspace','<p>Role selector demonstrates navigation only; it is not a security control. Demo edits are stored in this browser when available.</p><button onclick="resetDemo()">Reset demo records</button><h3 style="margin-top:22px">Session activity</h3><div class="mini">'+(historyLog.map(esc).join('<br>')||'No actions in this session yet.')+'</div>')}</div>`}
document.getElementById('main').innerHTML=`<div class="view">${html}<div class="foot">JML Social Content OS · First concept · Source-informed architecture + proposed operational modules · No external actions</div></div>`}
function refreshTable(){document.getElementById('contentTable').innerHTML=table(selected().filter(x=>(!filter||x.status===filter)&&x.title.toLowerCase().includes(search.toLowerCase())))}
function show(html){let d=document.getElementById('dialog');d.classList.remove('source-preview');d.innerHTML='<button class="close" onclick="document.getElementById(\'dialog\').close()" aria-label="Close dialog">✕</button>'+html;d.showModal()}function detail(id){let x=data.find(x=>x.id===id);modalItem=id;show(`<div class="eyebrow">${esc(x.brand)} / ${esc(x.channel)}</div><h2>${esc(x.title)}</h2>${badge(x.status)} <span class="tag">Demo record #${x.id}</span><div class="steps">${['Brief','Production','Review','Approved','Scheduled'].map(y=>`<span class="${x.status===y?'on':''}">${y}</span>`).join('')}</div><p><b>Goal:</b> ${x.goal} · <b>Pillar:</b> ${x.pillar}<br><b>Owner:</b> ${x.owner} · <b>Date:</b> ${x.date}</p><h3>Copy preview</h3><p>${esc(x.caption)}</p><div class="callout">${esc(x.note)}</div><label class="field" for="feedback">Review note</label><textarea id="feedback" rows="3" placeholder="Add a concise note for the owner…"></textarea><div class="row" style="margin-top:15px;justify-content:flex-start">${x.status==='Review'?'<button class="primary" onclick="changeStatus(\'Approved\')">Approve demo version</button><button onclick="changeStatus(\'Production\')">Request revision</button>':x.status==='Approved'?'<button class="primary" onclick="schedule()">Schedule in demo</button>':x.status==='Brief'?'<button class="primary" onclick="changeStatus(\'Production\')">Start production</button>':x.status==='Production'?'<button class="primary" onclick="changeStatus(\'Review\')">Send to demo review</button>':'<p class="mini">This item is scheduled only in the local mock.</p>'}</div>`)}
function changeStatus(status){let x=data.find(x=>x.id===modalItem),n=document.getElementById('feedback').value.trim();if(status==='Production'&&x.status==='Review'&&!n){toast('Add a revision note first.');return}x.status=status;if(n)x.note=n;historyLog.unshift(x.title+' → '+status);persist();document.getElementById('dialog').close();render();toast('Demo item updated. No external action.')}
function schedule(){let x=data.find(x=>x.id===modalItem);if(x.status!=='Approved')return toast('Approval is required.');x.status='Scheduled';historyLog.unshift(x.title+' → Demo scheduled');persist();document.getElementById('dialog').close();render();toast('Added to the local demo schedule. Nothing was published.')}
function newItem(){show('<h2>New content brief</h2><p class="mini">Create a demo calendar record. Detailed production briefs remain linked to the existing brief tool.</p><label class="field">Brand</label><select id="newbrand"><option>Nikki Nitro</option><option>MLD Tax</option><option>JML</option></select><label class="field">Content title</label><input id="newtitle" maxlength="100" placeholder="One clear content idea"><label class="field">Channel</label><select id="newchannel"><option>Instagram</option><option>LinkedIn</option></select><label class="field">Planned date</label><input type="date" id="newdate" value="2026-11-24"><label class="field">Primary objective</label><select id="newgoal"><option>Engagement</option><option>Qualified inquiries</option><option>Website visits</option><option>Brand awareness</option></select><button class="primary" style="margin-top:20px" onclick="saveNew()">Create demo brief</button>')}
function saveNew(){let title=document.getElementById('newtitle').value.trim(),date=document.getElementById('newdate').value;if(!title||!date)return toast('Add a title and date.');data.push({id:Math.max(...data.map(x=>x.id))+1,brand:document.getElementById('newbrand').value,title,date,channel:document.getElementById('newchannel').value,goal:document.getElementById('newgoal').value,pillar:'To define',format:'To define',owner:'Strategist',status:'Brief',caption:'Copy not written yet.',note:'Draft brief; strategy and creative checks required.'});persist();document.getElementById('dialog').close();document.getElementById('brand').value='all';render();toast('Demo brief created.')}
function recommend(){let b=document.getElementById('brand').value;data.push({id:Math.max(...data.map(x=>x.id))+1,brand:b==='all'?'Nikki Nitro':b,title:'Experiment: educational carousel',channel:'Instagram',format:'Carousel',pillar:'Education',date:'2026-11-27',owner:'Strategist',status:'Brief',goal:'Engagement',caption:'Proposed test, pending strategy review.',note:'Sample hypothesis from demo metrics. Human decision required before production.'});persist();go('plan');toast('Proposed test added as a draft. Strategy was not changed.')}
function exportData(){let blob=new Blob([JSON.stringify({prototype:true,notice:'Fictional demo records; no external publication',records:selected()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JML-Social-Content-Demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('Reset only the local demo records?')){data=structuredClone(initial);historyLog=[];persist();render();toast('Demo reset.')}}document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});window.addEventListener('hashchange',()=>{let k=location.hash.slice(1);if(titles[k]){view=k;render()}});if(titles[location.hash.slice(1)])view=location.hash.slice(1);render();

function openPlaybook(){window.open('./playbook.html','_blank','noopener')}
function downloadPlaybook(){window.open('./playbook.html','_blank','noopener')}
function launchIntelligence(){window.open('./intelligence.html','_blank','noopener')}
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Fictional coffee checklist — keep the routine repeatable</title><desc id="desc">Three clearly numbered checklist steps: keep the ratio consistent, choose the grind deliberately, and record steeping time.</desc>
<rect width="1080" height="1350" fill="#623c2c"/><text x="88" y="130" font-family="Arial,sans-serif" font-size="24" letter-spacing="4" fill="#e6caa5">NORTHSTAR · FICTIONAL DEMO</text>
<text x="88" y="275" font-family="Georgia,serif" font-size="77" fill="#fff9ef"><tspan x="88">Keep it</tspan><tspan x="88" dy="95">repeatable.</tspan></text>
<g font-family="Arial,sans-serif"><g fill="#e6caa5" font-size="35" font-weight="bold"><text x="88" y="540">01</text><text x="88" y="755">02</text><text x="88" y="970">03</text></g>
<g fill="#fff9ef" font-size="37" font-weight="bold"><text x="178" y="540">Use the same ratio.</text><text x="178" y="755">Choose the grind.</text><text x="178" y="970">Record the time.</text></g>
<g fill="#e6caa5" font-size="27"><text x="178" y="598">Start consistently before adjusting.</text><text x="178" y="813">Keep it deliberate from batch to batch.</text><text x="178" y="1028">Change one variable for the next test.</text></g>
<path d="M88 665h904M88 880h904M88 1095h904" stroke="#a98260" stroke-width="2"/>
<text x="88" y="1190" font-size="28" fill="#fff9ef">SAVE THIS FOR YOUR NEXT BATCH</text><text x="88" y="1275" font-size="19" fill="#e6caa5">LOCAL PROTOTYPE ARTWORK · EXAMPLE COPY &amp; DESIGN</text></g>
</svg>

een;gap:14px;padding:17px 34px;background:white;border-bottom:1px solid var(--line);flex-wrap:wrap}.topbar small{color:var(--muted)}.lang{display:flex;gap:5px;direction:ltr}.lang button{padding:6px 12px;font-size:13px}.lang button[aria-pressed=true]{background:var(--ink);color:white}.content{max-width:1160px;padding:34px 42px 70px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;font-weight:bold;letter-spacing:2px;color:#795893}h1,h2{font-family:'DM Serif Display',Georgia,serif;line-height:1.2;font-weight:normal}h1{font-size:42px;letter-spacing:-.8px;margin:12px 0 19px}h2{font-size:29px;margin:29px 0 13px}h3{font-size:19px;line-height:1.4;margin:24px 0 10px}html[lang=fa] h1,html[lang=fa] h2{font-family:Tahoma,Arial,sans-serif;line-height:1.6;font-weight:bold;letter-spacing:0}html[lang=fa] h1{font-size:32px}html[lang=fa] h2{font-size:23px}.lead{font-size:18px;color:var(--muted);max-width:850px;margin-bottom:28px}.hero{background:var(--ink);color:white;border-radius:20px;padding:34px;margin-bottom:25px}.hero h2{color:white;margin:8px 0 15px;font-size:34px}.hero p{color:#d6cce0}.hero .eyebrow{color:var(--lime)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,.badge{display:inline-block;font-size:11px;border-radius:6px;padding:4px 8px;background:#eee6f4;margin:3px 4px 3px 0;color:var(--purple)}.hero .chip{background:#40284e;color:#e6ddee}.badge.official{background:#e5efbf;color:#425500}.badge.observational{background:#fff0d1;color:#805900}.badge.proposed{background:#eee6f4;color:var(--purple)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;margin:20px 0}.panel h2:first-child{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid .panel{margin:0}.callout,blockquote{background:#edf3d7;border-inline-start:4px solid var(--lime);padding:18px 22px;border-radius:0 10px 10px 0;margin:22px 0}.warning{background:#fff3dd;border-color:#dba839}.muted,.note{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.step{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}.step b{color:var(--purple)}ul,ol{padding-inline-start:25px}li{margin:8px 0}.tablewrap{overflow:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px;background:white}th{text-align:start;background:#eee8f4;padding:12px;color:var(--purple)}td{padding:13px;border-bottom:1px solid var(--line);vertical-align:top}.ref{font-size:12px}.refs li{margin-bottom:17px}.footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;font-size:12px;color:var(--muted)}.chapter-nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.menu{display:none}select{border:1px solid var(--line);border-radius:9px;background:white;padding:10px;color:var(--ink);width:100%}label.field{display:block;font-weight:bold;font-size:13px;margin-bottom:7px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.output{border:1px solid #b7c986;background:#f5f9e9;border-radius:12px;padding:22px;margin:20px 0}.output h3{margin-top:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--ink);color:white;padding:12px 18px;border-radius:10px}.hidden{display:none}details{border:1px solid var(--line);background:white;border-radius:10px;padding:14px 18px;margin:12px 0}summary{cursor:pointer;font-weight:bold}.phase{font-size:12px;color:var(--muted)}@media(max-width:950px){.shell{grid-template-columns:210px minmax(0,1fr)}.content{padding:25px}.form-grid{grid-template-columns:1fr}.topbar{padding:15px 24px}}@media(max-width:700px){.shell{display:block}.sidebar{display:none;position:fixed;z-index:10;width:270px;inset-inline-start:0;box-shadow:0 0 0 100vw #1a003077}.shell.menu-open .sidebar{display:block}.menu </style></head><body><div class="shell" id="shell"><aside class="sidebar"><div class="brand" dir="ltr">JML<em>.</em></div><div class="brand-note">RESEARCH FIELD GUIDE</div><button class="menu" id="closeMenu" onclick="document.getElementById('shell').classList.remove('menu-open')">بستن فهرست</button><nav id="nav" aria-label="Chapters"></nav><p class="small" id="side-note"></p></aside><div class="main"><header class="topbar"><button class="menu" id="menuButton" onclick="document.getElementById('shell').classList.toggle('menu-open')">فهرست</button><div><strong id="top-title"></strong><br><small id="edition"></small></div><div class="lang" role="group" aria-label="Language"><button data-lang="fa" onclick="setLanguage('fa')" aria-pressed="true">فارسی</button><button data-lang="en" onclick="setLanguage('en')" aria-pressed="false">English</button></div></header><main class="content" id="main"></main></div></div><div class="toast hidden" id="toast" role="status"></div><noscript><p>JavaScript is required to switch chapters. / برای جابه‌جایی فصل‌ها JavaScript لازم است.</p></noscript><script>const chapters=[{"id": "start", "title": {"en": "Start with the right question", "fa": "از سؤال درست شروع کنیم"}, "body": {"en": "<section class=\"hero\"><div class=\"eyebrow\">A practical research guide</div><h2>What makes a post effective?<br>Evidence before imitation.</h2><p>A cover, a face, a short caption or a viral example is not a universal recipe. This guide helps any brand, creator or team turn observations into defensible creative decisions.</p><div class=\"chips\"><span class=\"chip\">LinkedIn</span><span class=\"chip\">Instagram</span><span class=\"chip\">Research → design → publishing → learning</span></div></section><div class=\"callout\"><b>The central principle:</b> effectiveness means progress toward the intended outcome with the intended audience. Reach, trust, useful engagement and qualified inquiries are different objectives.</div><div class=\"grid\"><section class=\"panel\"><h2>Use this guide to</h2><ul><li>Find credible sources and interpret their limitations.</li><li>Research covers, faces, hooks, length, format and timing.</li><li>Plan creative variants and capture comparable results.</li><li>Build a living playbook instead of following algorithm myths.</li></ul></section><section class=\"panel\"><h2>What it does not claim</h2><ul><li>No private account or client performance data was analyzed.</li><li>No universal winning format, posting time or word count.</li><li>No guaranteed growth or exact ranking formula.</li><li>No account connection, automated posting or paid experiment.</li></ul></section></div><h2>The research loop</h2><div class=\"steps\"><span class=\"step\">01 <b>Observe</b></span><span class=\"step\">02 <b>Code</b></span><span class=\"step\">03 <b>Compare</b></span><span class=\"step\">04 <b>Hypothesize</b></span><span class=\"step\">05 <b>Test</b></span><span class=\"step\">06 <b>Measure</b></span><span class=\"step\">07 <b>Learn</b></span></div><h2>Read evidence at the right level</h2><p><span class=\"badge official\">Official explanation</span> A platform describes a feature, metric or ranking approach. It does not disclose every signal, weight or future change.</p><p><span class=\"badge observational\">Observational study</span> A pattern appears in a sample. It does not establish that changing one attribute causes better performance.</p><p><span class=\"badge proposed\">Proposed experiment</span> A practical test design, not a proven best practice. Your outcome may remain inconclusive.</p><p class=\"note\">Prepared 17 November 2026. Official sources and research dates are shown where relevant. Platform availability and definitions can change. This is a general guide with JML branding, not a JML account audit.</p>", "fa": "<section class=\"hero\"><div class=\"eyebrow\">راهنمای عملی تحقیق</div><h2>چه چیزی یک پست را مؤثر می‌کند؟<br>شواهد، پیش از تقلید.</h2><p>کاور، چهره، کپشن کوتاه یا یک نمونه وایرال نسخه‌ای همگانی نیست. این راهنما به هر برند، تولیدکننده محتوا یا تیم کمک می‌کند مشاهده‌ها را به تصمیم‌های خلاقه قابل‌دفاع تبدیل کند.</p><div class=\"chips\"><span class=\"chip\">LinkedIn</span><span class=\"chip\">Instagram</span><span class=\"chip\">تحقیق ← طراحی ← انتشار ← یادگیری</span></div></section><div class=\"callout\"><b>اصل مرکزی:</b> اثربخشی یعنی پیشرفت به سوی نتیجه موردنظر، با مخاطب موردنظر. دسترسی، اعتماد، تعامل مفید و درخواست‌های مرتبط اهداف متفاوتی هستند.</div><div class=\"grid\"><section class=\"panel\"><h2>این راهنما برای چیست؟</h2><ul><li>یافتن منابع معتبر و شناخت محدودیت شواهد آن‌ها.</li><li>تحقیق درباره کاور، چهره، هوک، طول متن، فرمت و زمان.</li><li>طراحی نسخه‌های آزمایشی و ثبت نتایج قابل‌مقایسه.</li><li>ساخت پلی‌بوک زنده به‌جای پیروی از افسانه‌های الگوریتم.</li></ul></section><section class=\"panel\"><h2>چه ادعایی نمی‌کند؟</h2><ul><li>داده خصوصی حساب یا عملکرد واقعی هیچ کلاینتی تحلیل نشده است.</li><li>فرمت، ساعت یا تعداد کلمه برنده و همگانی معرفی نمی‌کند.</li><li>رشد تضمینی یا فرمول دقیق رتبه‌بندی ارائه نمی‌دهد.</li><li>حسابی وصل نشده، پستی خودکار منتشر نشده و آزمایش پولی اجرا نشده است.</li></ul></section></div><h2>چرخه تحقیق</h2><div class=\"steps\"><span class=\"step\">۰۱ <b>مشاهده</b></span><span class=\"step\">۰۲ <b>کدگذاری</b></span><span class=\"step\">۰۳ <b>مقایسه</b></span><span class=\"step\">۰۴ <b>فرضیه</b></span><span class=\"step\">۰۵ <b>آزمایش</b></span><span class=\"step\">۰۶ <b>اندازه‌گیری</b></span><span class=\"step\">۰۷ <b>یادگیری</b></span></div><h2>شواهد را در سطح درست بخوانیم</h2><p><span class=\"badge official\">توضیح رسمی</span> پلتفرم یک قابلیت، شاخص یا رویکرد رتبه‌بندی را توضیح می‌دهد؛ نه تمام سیگنال‌ها، وزن‌ها یا تغییرات آینده را.</p><p><span class=\"badge observational\">مطالعه مشاهده‌ای</span> الگویی در یک نمونه دیده شده است؛ این ثابت نمی‌کند تغییر یک ویژگی باعث عملکرد بهتر می‌شود.</p><p><span class=\"badge proposed\">آزمایش پیشنهادی</span> طرحی عملی برای تست است، نه بهترین روش اثبات‌شده. نتیجه حساب شما ممکن است همچنان نامشخص بماند.</p><p class=\"note\">تهیه‌شده در ۱۷ نوامبر ۲۰۲۶. تاریخ منابع رسمی و مطالعات در بخش مرتبط آمده است. قابلیت‌ها و تعاریف پلتفرم‌ها ممکن است تغییر کنند. این راهنمای عمومی با برندینگ JML است، نه ممیزی حساب JML.</p>"}}, {"id": "algorithms", "title": {"en": "Algorithms: known vs unknown", "fa": "الگوریتم‌ها: معلوم و نامعلوم"}, "body": {"en": "<span class=\"badge official\">Official sources, with dates</span><h2>LinkedIn: candidate retrieval, then personalized ranking</h2><p>LinkedIn’s engineering explanation of 12 March 2026 describes retrieving potentially relevant posts, then using a personalized sequential ranking system. Professional context such as industry and skills, and past behavior such as reading, liking, commenting, returning or skipping, help infer relevance. Semantic understanding is more than matching a keyword. Freshness and relevance both matter. <a class=\"ref\" href=\"https://www.linkedin.com/blog/engineering/feed/engineering-the-next-generation-of-linkedins-feed\" target=\"_blank\" rel=\"noopener\">LinkedIn Engineering, March 2026 ↗</a></p><p>Its 2026 feed update also emphasizes authentic, useful professional content and reducing generic recycled content, engagement bait, automated comments and engagement pods. This supports specific expertise and genuine conversation, not manipulation. <a class=\"ref\" href=\"https://news.linkedin.com/2026/ImprovingTheFeed\" target=\"_blank\" rel=\"noopener\">LinkedIn feed update ↗</a></p><div class=\"callout\"><b>Practical inference, not a disclosed ranking rule:</b> make the intended professional audience and useful takeaway clear; show original evidence or experience; write an opening that earns attention honestly. Do not stuff keywords or request empty reactions to game distribution.</div><h2>Instagram: multiple surfaces and predictions</h2><p>Meta’s official 2023 explanation describes ranking systems that combine multiple predictions and personalize recommendations. Feed, Stories, Explore and Reels are not one interchangeable distribution surface. A useful way to think about ranking is: available eligible content → signals and predictions → personalized ordering or recommendations. <a class=\"ref\" href=\"https://about.fb.com/news/2023/06/how-ai-ranks-content-on-facebook-and-instagram/\" target=\"_blank\" rel=\"noopener\">Meta explanation, June 2023 ↗</a></p><p>The accessible Instagram Feed system card is dated February 2022. It is useful background on the architecture, <b>not confirmation of the exact November 2026 implementation</b>. The current architecture, model weights and all experiments are not fully public. <a class=\"ref\" href=\"https://ai.meta.com/tools/system-cards/instagram-feed-ranking/\" target=\"_blank\" rel=\"noopener\">Dated Instagram Feed system card ↗</a></p><h2>What we should not pretend to know</h2><div class=\"tablewrap\"><table><thead><tr><th>Unsupported universal claim</th><th>More defensible position</th></tr></thead><tbody><tr><td>“One save is worth exactly five likes.”</td><td>No fixed public exchange rate is established by these sources.</td></tr><tr><td>“Faces always receive an algorithm bonus.”</td><td>Faces are a creative variable to test; audience response and context may explain observed differences.</td></tr><tr><td>“The first hour decides everything.”</td><td>Do not turn an anecdote into a published deterministic rule. Capture outcomes at consistent ages.</td></tr><tr><td>“Post at this exact hour and use this many words.”</td><td>Test feasible audience-specific times and content lengths against a defined outcome.</td></tr><tr><td>“Reach proves business value.”</td><td>Reach is distribution. Relevant engagement, qualified actions and verified business outcomes answer different questions.</td></tr></tbody></table></div><h2>Trial Reels are exploration, not a controlled experiment</h2><p>Instagram introduced Trial Reels to try content with non-followers before broader sharing. Check current eligibility in the account. A Trial Reel and a normal follower-distributed Reel have different audiences; comparing them is not randomized A/B testing. <a class=\"ref\" href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">Meta announcement, December 2024 ↗</a></p><h2>Originality and eligibility: two separate ideas</h2><p>In January 2026, Meta reported that 75% of Instagram recommendations in the US came from original posts after an increase in Q4 2025. This describes the composition of recommendations, <b>not a promised 75% reach increase</b> for an original post. Do not confuse the article’s separate advertising-model results with organic effects. <a class=\"ref\" href=\"https://about.fb.com/news/2026/01/2026-ai-drives-performance/\" target=\"_blank\" rel=\"noopener\">Meta, January 2026 ↗</a></p><p>Meta’s foundational recommendation guidance distinguishes content allowed to remain on the platform from content eligible for recommendation. Eligibility is not guaranteed reach. The 2020 source establishes this distinction, not a complete current policy checklist. <a class=\"ref\" href=\"https://about.fb.com/news/2020/08/recommendation-guidelines/\" target=\"_blank\" rel=\"noopener\">Meta recommendation guidance ↗</a></p><p class=\"note\">Research limit: some current Meta transparency and creator pages could not be fully retrieved during this review. Detailed current numerical weights, thresholds and supposed external-link penalties are therefore not claimed as verified facts.</p>", "fa": "<span class=\"badge official\">منابع رسمی همراه با تاریخ</span><h2>LinkedIn: بازیابی گزینه‌ها، سپس رتبه‌بندی شخصی‌سازی‌شده</h2><p>توضیح مهندسی لینکدین در ۱۲ مارس ۲۰۲۶ ابتدا یافتن پست‌های بالقوه مرتبط و سپس رتبه‌بندی ترتیبی شخصی‌سازی‌شده را توصیف می‌کند. زمینه حرفه‌ای مانند صنعت و مهارت‌ها و رفتار گذشته مثل خواندن، لایک، نظر، بازگشت یا ردکردن محتوا به تخمین ارتباط کمک می‌کنند. درک معنایی فراتر از تطبیق یک کلمه کلیدی است. تازگی و ارتباط هر دو مهم‌اند. <a class=\"ref\" href=\"https://www.linkedin.com/blog/engineering/feed/engineering-the-next-generation-of-linkedins-feed\" target=\"_blank\" rel=\"noopener\">مهندسی LinkedIn، مارس ۲۰۲۶ ↗</a></p><p>به‌روزرسانی فید در ۲۰۲۶ بر محتوای حرفه‌ای اصیل و مفید و کاهش محتوای عمومی و بازیافتی، طعمه تعامل، کامنت‌های خودکار و گروه‌های تبادل تعامل تأکید می‌کند. این جهت‌گیری از تخصص مشخص و گفت‌وگوی واقعی حمایت می‌کند، نه دست‌کاری توزیع. <a class=\"ref\" href=\"https://news.linkedin.com/2026/ImprovingTheFeed\" target=\"_blank\" rel=\"noopener\">به‌روزرسانی فید LinkedIn ↗</a></p><div class=\"callout\"><b>استنباط عملی، نه قانون اعلام‌شده رتبه‌بندی:</b> مخاطب حرفه‌ای و نکته مفید محتوا را روشن کنید؛ شواهد یا تجربه اصیل نشان دهید؛ شروعی بنویسید که صادقانه توجه بگیرد. انباشت کلیدواژه یا درخواست واکنش بی‌معنی راهبرد قابل‌اتکایی نیست.</div><h2>Instagram: چند سطح توزیع و چند پیش‌بینی</h2><p>توضیح رسمی متا در ۲۰۲۳ سیستم‌هایی را توصیف می‌کند که چند پیش‌بینی را ترکیب و پیشنهادها را شخصی‌سازی می‌کنند. فید، استوری، اکسپلور و ریلز یک سطح توزیع یکسان نیستند. مدل ذهنی مفید این است: محتوای واجدشرایط در دسترس ← سیگنال‌ها و پیش‌بینی‌ها ← ترتیب یا پیشنهاد شخصی‌سازی‌شده. <a class=\"ref\" href=\"https://about.fb.com/news/2023/06/how-ai-ranks-content-on-facebook-and-instagram/\" target=\"_blank\" rel=\"noopener\">توضیح متا، ژوئن ۲۰۲۳ ↗</a></p><p>کارت سیستم قابل‌دسترسی فید اینستاگرام مربوط به فوریه ۲۰۲۲ است. این منبع برای شناخت معماری مفید است، <b>نه تأیید پیاده‌سازی دقیق نوامبر ۲۰۲۶</b>. معماری فعلی، وزن مدل‌ها و همه آزمایش‌های پلتفرم به‌طور کامل عمومی نیستند. <a class=\"ref\" href=\"https://ai.meta.com/tools/system-cards/instagram-feed-ranking/\" target=\"_blank\" rel=\"noopener\">کارت تاریخ‌دار سیستم فید Instagram ↗</a></p><h2>چه چیزهایی را نباید وانمود کنیم می‌دانیم؟</h2><div class=\"tablewrap\"><table><thead><tr><th>ادعای همگانی بدون پشتوانه</th><th>موضع قابل‌دفاع‌تر</th></tr></thead><tbody><tr><td>«هر ذخیره دقیقاً به اندازه پنج لایک ارزش دارد.»</td><td>این منابع نرخ مبادله ثابت و عمومی برای تعامل‌ها اثبات نمی‌کنند.</td></tr><tr><td>«چهره همیشه امتیاز الگوریتمی می‌گیرد.»</td><td>چهره یک متغیر خلاقه قابل‌آزمایش است؛ پاسخ مخاطب و زمینه می‌توانند تفاوت مشاهده‌شده را توضیح دهند.</td></tr><tr><td>«ساعت اول همه‌چیز را تعیین می‌کند.»</td><td>حکایت را به قانون قطعی منتشرشده تبدیل نکنید؛ نتایج را در سن یکسان پست ثبت کنید.</td></tr><tr><td>«دقیقاً این ساعت پست کن و همین تعداد کلمه بنویس.»</td><td>زمان‌های عملی متناسب با مخاطب و طول‌های متفاوت محتوا را برای نتیجه مشخص بیازمایید.</td></tr><tr><td>«ریچ، ارزش تجاری را ثابت می‌کند.»</td><td>ریچ یعنی توزیع. تعامل مرتبط، اقدام واجدشرایط و نتیجه تجاری تأییدشده سؤال‌های دیگری را پاسخ می‌دهند.</td></tr></tbody></table></div><h2>Trial Reels برای اکتشاف است، نه آزمایش کنترل‌شده</h2><p>اینستاگرام Trial Reels را برای امتحان محتوا با غیرفالوئرها پیش از اشتراک گسترده‌تر معرفی کرد. دسترسی فعلی را در حساب بررسی کنید. مخاطبان یک Trial Reel با ریلز عادی توزیع‌شده میان فالوئرها متفاوت‌اند؛ مقایسه آن‌ها آزمایش تصادفی A/B نیست. <a class=\"ref\" href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">اعلام رسمی متا، دسامبر ۲۰۲۴ ↗</a></p><h2>اصالت و واجدشرایط‌بودن: دو مفهوم جدا</h2><p>متا در ژانویه ۲۰۲۶ گزارش کرد پس از افزایش در فصل چهارم ۲۰۲۵، ۷۵٪ پیشنهادهای اینستاگرام در آمریکا از پست‌های اصیل بوده است. این عدد ترکیب پیشنهادها را توصیف می‌کند، <b>نه وعده ۷۵٪ افزایش ریچ</b> برای یک پست اصیل. نتایج مدل تبلیغاتی در بخش دیگر همان مقاله را با اثر ارگانیک اشتباه نگیرید. <a class=\"ref\" href=\"https://about.fb.com/news/2026/01/2026-ai-drives-performance/\" target=\"_blank\" rel=\"noopener\">متا، ژانویه ۲۰۲۶ ↗</a></p><p>راهنمای پایه‌ای متا، محتوای مجاز برای باقی‌ماندن در پلتفرم را از محتوای واجدشرایط پیشنهاد جدا می‌کند. واجدشرایط‌بودن تضمین ریچ نیست. منبع ۲۰۲۰ این تمایز را توضیح می‌دهد، نه فهرست کامل سیاست‌های فعلی را. <a class=\"ref\" href=\"https://about.fb.com/news/2020/08/recommendation-guidelines/\" target=\"_blank\" rel=\"noopener\">راهنمای پیشنهاد محتوا در متا ↗</a></p><p class=\"note\">محدودیت تحقیق: بعضی صفحات فعلی شفافیت و راهنمای سازندگان متا در این بررسی به‌طور کامل بازیابی نشدند. بنابراین وزن‌های عددی، آستانه‌ها و جریمه‌های ادعایی لینک خارجی به‌عنوان واقعیت تأییدشده مطرح نمی‌شوند.</p>"}}, {"id": "evidence", "title": {"en": "What the evidence supports", "fa": "شواهد چه چیزی را پشتیبانی می‌کنند؟"}, "body": {"en": "\n<p><strong>A pattern is not a rule.</strong> Research can tell us what is worth testing, but a high-performing post does not reveal why it performed well. Audience fit, account reputation, topic, production quality, format, paid support, timing and post age can all change the result. A face appearing on a popular cover is not proof that the face caused the engagement.</p>\n<h3>Format benchmarks: useful direction, not a guarantee</h3>\n<p>Metricool’s 2026 LinkedIn study analyzes a large observational dataset containing personal profiles and Company Pages. Format and account-type differences make document/carousel and multi-image treatments useful candidates for testing. Do not turn a dataset average into a universal recommendation for every creator. Separate personal profiles from Company Pages, compare similar objectives and inspect the study’s sampling period and population. <a href=\"https://metricool.com/press-release-linkedin-study-2026/\" target=\"_blank\" rel=\"noopener\">LinkedIn study summary</a> · <a href=\"https://metricool.com/wp-content/uploads/Linkedin-Study-2026-EN.pdf\" target=\"_blank\" rel=\"noopener\">Methodology and report</a></p>\n<p>Metricool’s 2026 Instagram study reports strong average performance for Reels and carousels, with carousels associated with saves and question/comment prompts associated with comments. These are observed associations. They do not establish that switching format, adding a question or removing hashtags will cause growth for a particular account. Customer selection, topic mix and nonrandom creative choices matter. <a href=\"https://metricool.com/press-release-instagram-study-2026/\" target=\"_blank\" rel=\"noopener\">Instagram study</a></p>\n<h3>Faces and human storytelling</h3>\n<p>Georgia Tech/Yahoo research presented in 2014 examined Instagram images and found face-containing photos more likely to receive likes and comments. It is an old, observational result from a very different Instagram environment. It does not prove that a face on today’s business carousel cover increases qualified leads. Treat it as a reason to test a relevant presenter, not a rule to put faces everywhere. <a href=\"https://news.gatech.edu/news/2014/03/20/face-it-instagram-pictures-faces-are-more-popular\" target=\"_blank\" rel=\"noopener\">Georgia Tech research summary</a></p>\n<p>LinkedIn’s Creative Labs research on B2B video ads identifies patterns in human, emotional and culturally relevant creative. It can inspire presenter-led expert videos, but paid-video findings do not automatically transfer to organic posts, cover images or every industry. <a href=\"https://www.linkedin.com/business/marketing/blog/marketing-collective/pixels-and-promises\" target=\"_blank\" rel=\"noopener\">LinkedIn Creative Labs</a></p>\n<p><strong>Practical conclusion:</strong> label each recommendation as an external research hypothesis, an observation from your account, a repeated result or inconclusive. No account-specific analysis has been performed for this guide.</p>\n", "fa": "\n<p><strong>الگو با قانون فرق دارد.</strong> پژوهش نشان می‌دهد چه چیزی ارزش آزمایش دارد، اما یک پست پربازده به‌تنهایی علت موفقیتش را آشکار نمی‌کند. تناسب مخاطب، اعتبار حساب، موضوع، کیفیت تولید، قالب، تبلیغ پولی، زمان انتشار و سن پست همگی می‌توانند نتیجه را تغییر دهند. وجود چهره روی یک کاور محبوب ثابت نمی‌کند که چهره باعث تعامل شده است.</p>\n<h3>مقایسه قالب‌ها: راهنمای اولیه، نه تضمین</h3>\n<p>مطالعه ۲۰۲۶ متریکول درباره لینکدین، مجموعه بزرگی از داده‌های مشاهده‌ای شامل پروفایل‌های شخصی و صفحه‌های شرکتی را بررسی می‌کند. تفاوت عملکرد قالب‌ها و نوع حساب باعث می‌شود پست‌های سندی/کاروسل و چندتصویری گزینه‌های مناسبی برای آزمایش باشند. میانگین یک دیتاست را به توصیه همگانی برای همه تولیدکنندگان تبدیل نکنید. پروفایل شخصی را از صفحه شرکتی جدا کنید، هدف‌های مشابه را مقایسه کنید و دوره نمونه‌گیری و جامعه مطالعه را بخوانید. <a href=\"https://metricool.com/press-release-linkedin-study-2026/\" target=\"_blank\" rel=\"noopener\">خلاصه مطالعه لینکدین</a> · <a href=\"https://metricool.com/wp-content/uploads/Linkedin-Study-2026-EN.pdf\" target=\"_blank\" rel=\"noopener\">روش‌شناسی و گزارش</a></p>\n<p>مطالعه ۲۰۲۶ متریکول درباره اینستاگرام، عملکرد میانگین قوی برای ریلز و کاروسل گزارش می‌کند؛ کاروسل با ذخیره‌کردن بیشتر و سؤال یا درخواست نظر با کامنت بیشتر همراه بوده است. این‌ها ارتباط‌های مشاهده‌شده‌اند. ثابت نمی‌کنند تغییر قالب، افزودن سؤال یا حذف هشتگ برای یک حساب مشخص باعث رشد می‌شود. انتخاب مشتریان حاضر در نمونه، ترکیب موضوع‌ها و انتخاب غیرتصادفی طرح‌ها اهمیت دارند. <a href=\"https://metricool.com/press-release-instagram-study-2026/\" target=\"_blank\" rel=\"noopener\">مطالعه اینستاگرام</a></p>\n<h3>چهره و روایت انسانی</h3>\n<p>پژوهش جورجیا تک و یاهو که در سال ۲۰۱۴ ارائه شد، تصاویر اینستاگرام را بررسی کرد و دریافت عکس‌های دارای چهره با احتمال بیشتری لایک و کامنت می‌گیرند. این یافته قدیمی و مشاهده‌ای است و به محیطی بسیار متفاوت از اینستاگرام امروز مربوط می‌شود. ثابت نمی‌کند حضور چهره روی کاور یک کاروسل تجاری امروز، لید واجدشرایط بیشتری می‌آورد. آن را دلیلی برای آزمایش حضور یک ارائه‌دهنده مرتبط بدانید، نه قانونی برای گذاشتن چهره در همه طرح‌ها. <a href=\"https://news.gatech.edu/news/2014/03/20/face-it-instagram-pictures-faces-are-more-popular\" target=\"_blank\" rel=\"noopener\">خلاصه پژوهش جورجیا تک</a></p>\n<p>پژوهش Creative Labs لینکدین درباره تبلیغات ویدئویی B2B، الگوهایی در محتوای انسانی، احساسی و مرتبط با فرهنگ شناسایی می‌کند. می‌توان از آن برای ویدئوی کارشناسی با حضور ارائه‌دهنده ایده گرفت، اما یافته تبلیغات ویدئویی خودبه‌خود به پست ارگانیک، تصویر کاور یا همه صنعت‌ها تعمیم‌پذیر نیست. <a href=\"https://www.linkedin.com/business/marketing/blog/marketing-collective/pixels-and-promises\" target=\"_blank\" rel=\"noopener\">پژوهش Creative Labs لینکدین</a></p>\n<p><strong>نتیجه کاربردی:</strong> هر توصیه را با یکی از این برچسب‌ها ثبت کنید: فرضیه بر پایه پژوهش بیرونی، مشاهده در حساب خودتان، نتیجه تکرارشده یا نامشخص. برای تهیه این راهنما، داده‌های هیچ حساب مشخصی تحلیل نشده است.</p>\n"}}, {"id": "method", "title": {"en": "A repeatable research method", "fa": "روش تحقیق تکرارپذیر"}, "body": {"en": "\n<p><strong>Observe → Code → Compare → Hypothesize → Test → Measure → Learn.</strong> Begin with the audience and business question, not a gallery of viral posts. Write inclusion rules before collecting examples. Include weak, average and strong work so the sample does not suffer from survivor bias.</p>\n<h3>1. Build a comparable sample</h3>\n<p>A practical starting audit is the last 90 days of your own posts plus 10–15 relevant peer accounts and 20–30 comparable recent posts per peer. These are workload-planning targets, not a statistical guarantee. Extend the period when volume is low; record changes in platform behavior, offers or audience. Keep LinkedIn member posts separate from Company Pages, and separate Instagram Reels, carousels, single images and Stories. Also distinguish paid, organic and unknown distribution.</p>\n<p>Use authorized native exports or approved connectors for your own accounts. For competitors, collect only publicly visible information. Reach, saves, leads, detailed audience data and actual spend are usually not public. Record unavailable fields as unknown, never as zero or an invented estimate. Save the URL, capture date, post age, metric source and publication timezone when reliably known.</p>\n<h3>2. Use a written codebook</h3>\n<ul><li><strong>Identity:</strong> platform, account type, post URL/ID, topic, intended audience, objective, format, language, market, paid/organic status and observation age.</li><li><strong>Cover:</strong> photo/graphic/video frame; face present or absent; presenter versus stock/illustration; approximate face area; title word count; mobile readability, contrast, clutter and promise.</li><li><strong>Writing:</strong> first-line hook type, words/characters, visible text before truncation, specificity, source evidence, CTA, link placement, hashtags and mentions.</li><li><strong>Production and distribution:</strong> slide count, video duration, subtitles, opening action, rights, day/time, audience timezone, collaboration, paid support and resharing.</li><li><strong>Outcomes:</strong> fixed-age results, costs and production hours. Do not infer sensitive demographic attributes from faces.</li></ul>\n<p>Have two reviewers independently code a subset, discuss disagreements and refine definitions. AI can assist tagging, but a person should verify visual features, claims and intended meaning. Keep source links; access to a competitor’s image does not grant reuse rights.</p>\n<h3>3. Compare without overstating</h3>\n<p>Prefer within-account, within-format and matched-topic comparisons. Report median, spread, sample size, absolute outcomes and rates together. Adjust for account, topic, format, timing and paid support when the sample permits, but remember that regression remains observational. Thousands of views on one post are not thousands of independent creative experiments. Avoid stopping the test the moment a favorable number appears; insufficient evidence should produce an inconclusive decision.</p>\n", "fa": "\n<p><strong>مشاهده ← کدگذاری ← مقایسه ← فرضیه‌سازی ← آزمایش ← اندازه‌گیری ← یادگیری.</strong> از مخاطب و سؤال کسب‌وکار شروع کنید، نه از گالری پست‌های وایرال. پیش از جمع‌آوری نمونه‌ها، قواعد ورود به نمونه را بنویسید. کارهای ضعیف، متوسط و قوی را همگی وارد کنید تا نمونه دچار سوگیری بازماندگان نشود.</p>\n<h3>۱. نمونه قابل‌مقایسه بسازید</h3>\n<p>نقطه شروع عملی می‌تواند پست‌های ۹۰ روز اخیر خودتان، همراه با ۱۰ تا ۱۵ حساب مشابه و مرتبط و ۲۰ تا ۳۰ پست اخیر قابل‌مقایسه از هر حساب باشد. این عددها برای برنامه‌ریزی حجم کارند، نه تضمین کفایت آماری. اگر حجم انتشار کم است، بازه را طولانی‌تر کنید و تغییر رفتار پلتفرم، پیشنهاد تجاری یا مخاطب را ثبت کنید. پست اعضای لینکدین را از صفحه‌های شرکتی جدا کنید؛ در اینستاگرام نیز ریلز، کاروسل، تک‌تصویر و استوری را جدا نگه دارید. توزیع پولی، ارگانیک و نامشخص هم باید تفکیک شود.</p>\n<p>برای حساب خودتان از خروجی رسمی مجاز یا اتصال تأییدشده استفاده کنید. برای رقبا فقط اطلاعات عمومی را جمع‌آوری کنید. ریچ، ذخیره‌ها، لیدها، اطلاعات تفصیلی مخاطب و هزینه واقعی معمولاً عمومی نیستند. فیلد در دسترس‌نبودن را «نامشخص» ثبت کنید، نه صفر یا تخمین ساختگی. لینک، تاریخ ثبت، سن پست، منبع شاخص و منطقه زمانی انتشار را، اگر قابل‌اعتماد است، نگه دارید.</p>\n<h3>۲. راهنمای کدگذاری مکتوب داشته باشید</h3>\n<ul><li><strong>شناسه:</strong> پلتفرم، نوع حساب، لینک/شناسه پست، موضوع، مخاطب هدف، هدف، قالب، زبان، بازار، وضعیت پولی/ارگانیک و سن مشاهده.</li><li><strong>کاور:</strong> عکس/گرافیک/فریم ویدئو؛ وجود یا نبود چهره؛ ارائه‌دهنده واقعی در برابر استوک/تصویرسازی؛ سهم تقریبی چهره از تصویر؛ تعداد کلمه تیتر؛ خوانایی موبایل، کنتراست، شلوغی و وعده محتوا.</li><li><strong>نوشتار:</strong> نوع هوک خط اول، تعداد کلمه/کاراکتر، متن قابل‌مشاهده پیش از کوتاه‌شدن، مشخص‌بودن ادعا، منبع، دعوت به اقدام، جای لینک، هشتگ و منشن.</li><li><strong>تولید و توزیع:</strong> تعداد اسلاید، مدت ویدئو، زیرنویس، حرکت آغازین، حقوق استفاده، روز/ساعت، منطقه زمانی مخاطب، همکاری، تبلیغ پولی و بازنشر.</li><li><strong>نتایج:</strong> عملکرد در سن ثابت پست، هزینه و ساعت تولید. ویژگی‌های جمعیت‌شناختی حساس را از چهره استنباط نکنید.</li></ul>\n<p>دو ارزیاب بخشی از نمونه را مستقل کدگذاری کنند، اختلاف‌ها را بررسی کنند و تعریف‌ها را روشن‌تر کنند. هوش مصنوعی می‌تواند در برچسب‌گذاری کمک کند، اما ویژگی‌های بصری، ادعاها و معنای محتوا باید توسط انسان بررسی شوند. لینک منبع را نگه دارید؛ دسترسی به تصویر رقیب، مجوز بازاستفاده از آن نیست.</p>\n<h3>۳. بدون اغراق مقایسه کنید</h3>\n<p>مقایسه درون یک حساب، یک قالب و موضوع‌های هم‌تراز را ترجیح دهید. میانه، پراکندگی، تعداد نمونه، نتیجه مطلق و نرخ را کنار هم گزارش کنید. اگر نمونه اجازه می‌دهد، اثر حساب، موضوع، قالب، زمان و تبلیغ پولی را در تحلیل لحاظ کنید؛ بااین‌حال رگرسیون همچنان مشاهده‌ای است. هزاران بازدید یک پست به معنای هزاران آزمایش مستقل خلاقه نیست. آزمایش را صرفاً با مشاهده اولین عدد مطلوب متوقف نکنید؛ شواهد ناکافی باید به تصمیم «نامشخص» منجر شود.</p>\n"}}, {"id": "design", "title": {"en": "Design and publishing decisions", "fa": "تصمیم‌های طراحی و انتشار"}, "body": {"en": "\n<p><strong>Design for comprehension, then test performance.</strong> A cover should communicate a specific promise to the right audience. Use a clear visual hierarchy, readable type at actual phone size and a first frame that matches what the post delivers. These are practical quality recommendations, not claims about a secret ranking formula.</p>\n<ul><li><strong>Faces:</strong> use a real presenter when identity, trust, explanation or a personal story is relevant. Compare against an equally clear diagram or product view. Do not add an unrelated face only because a benchmark found an association.</li><li><strong>Text:</strong> put the main idea early, make the claim specific and support it. A short caption may improve clarity; a longer one may supply evidence and context. There is no universal ideal word count established by this guide.</li><li><strong>Hooks:</strong> a problem, concrete outcome, useful question or story can open the post. Deliver the promised value; avoid misleading curiosity gaps and unsupported claims.</li><li><strong>Format:</strong> choose a carousel for a sequence, a diagram for a relationship, a demonstration for a process, or video when motion and explanation add value. A different format is a different content package, not merely a new container.</li><li><strong>Accessibility and rights:</strong> check contrast, captions/subtitles, descriptive text where supported, safe zones, licensing and consent. Verify factual claims and ensure the final CTA and destination work.</li></ul>\n<h3>Publishing checklist</h3>\n<p>Confirm the intended account, audience timezone, approved asset version, platform-specific preview, tags, links and tracking. Inspect the real published post and record its live URL; a scheduled status is not proof of successful publication. Track paid support and collaborations so they are not mistaken for the effect of the cover. Respond within a defined community scope and escalate sensitive questions to the appropriate person.</p>\n<p>Use campaign-tagged links when appropriate so off-platform actions can be analyzed. Keep source, medium and campaign naming consistent; tracking gaps and consent limits still affect interpretation. <a href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">Google Analytics campaign URL guidance</a></p>\n<p>Test feasible publishing slots in the audience’s timezone instead of copying a global “best hour.” Balance topic, weekday and format over several weeks. The aim is an efficient, repeatable workflow that reaches relevant people, not a ritual intended to satisfy an imagined algorithm.</p>\n", "fa": "\n<p><strong>ابتدا برای فهم بهتر طراحی کنید؛ سپس عملکرد را آزمایش کنید.</strong> کاور باید وعده‌ای مشخص را به مخاطب درست منتقل کند. سلسله‌مراتب بصری روشن، متن خوانا در اندازه واقعی موبایل و فریم اول هماهنگ با محتوای واقعی داشته باشید. این‌ها توصیه‌های عملی برای کیفیت‌اند، نه ادعا درباره فرمول مخفی رتبه‌بندی.</p>\n<ul><li><strong>چهره:</strong> وقتی هویت، اعتماد، توضیح یا داستان شخصی مهم است، از ارائه‌دهنده واقعی استفاده کنید. آن را با یک نمودار یا نمای محصول به همان اندازه روشن مقایسه کنید. صرفاً به دلیل یک ارتباط آماری در گزارش، چهره نامرتبط به طرح اضافه نکنید.</li><li><strong>متن:</strong> ایده اصلی را زود مطرح کنید، ادعا را مشخص کنید و برایش پشتوانه بیاورید. کپشن کوتاه ممکن است وضوح بیشتری بدهد؛ کپشن بلندتر ممکن است شواهد و زمینه لازم را فراهم کند. این راهنما هیچ تعداد کلمه ایدئال و همگانی را ثابت نمی‌کند.</li><li><strong>هوک:</strong> مسئله، نتیجه مشخص، سؤال مفید یا داستان می‌تواند شروع پست باشد. ارزشی را که وعده داده‌اید ارائه دهید؛ از کنجکاوی گمراه‌کننده و ادعای بدون پشتوانه دوری کنید.</li><li><strong>قالب:</strong> برای توالی از کاروسل، برای رابطه از نمودار، برای فرایند از نمایش عملی و وقتی حرکت و توضیح ارزش می‌افزاید از ویدئو استفاده کنید. تغییر قالب، تغییر یک بسته محتوایی است؛ فقط عوض‌کردن ظرف نیست.</li><li><strong>دسترس‌پذیری و حقوق استفاده:</strong> کنتراست، زیرنویس، متن توصیفی در صورت پشتیبانی، محدوده امن، مجوز و رضایت را بررسی کنید. ادعاهای واقعی را تأیید و کارکرد دعوت به اقدام و مقصد را کنترل کنید.</li></ul>\n<h3>چک‌لیست انتشار</h3>\n<p>حساب مقصد، منطقه زمانی مخاطب، نسخه تأییدشده فایل، پیش‌نمایش مخصوص پلتفرم، تگ‌ها، لینک‌ها و رهگیری را کنترل کنید. پست واقعی منتشرشده را ببینید و لینک زنده آن را ثبت کنید؛ وضعیت «زمان‌بندی‌شده» اثبات انتشار موفق نیست. تبلیغ پولی و همکاری‌ها را ثبت کنید تا اثرشان با اثر کاور اشتباه نشود. پاسخ‌گویی به جامعه مخاطبان باید در محدوده مسئولیت مشخص انجام شود و سؤال‌های حساس به فرد مناسب ارجاع شوند.</p>\n<p>در صورت تناسب، از لینک‌های دارای برچسب کمپین استفاده کنید تا اقدام‌های بیرون پلتفرم قابل‌تحلیل باشند. نام‌گذاری source، medium و campaign را یکدست نگه دارید؛ نقص رهگیری و محدودیت رضایت کاربر همچنان بر تفسیر اثر می‌گذارند. <a href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">راهنمای گوگل آنالیتیکس برای لینک کمپین</a></p>\n<p>به‌جای کپی‌کردن یک «بهترین ساعت» جهانی، زمان‌های عملی را در منطقه زمانی مخاطب آزمایش کنید. موضوع، روز هفته و قالب را طی چند هفته متوازن نگه دارید. هدف، فرایندی کارآمد و تکرارپذیر برای رسیدن به افراد مرتبط است، نه تشریفاتی برای راضی‌کردن یک الگوریتم فرضی.</p>\n"}}, {"id": "experiments", "title": {"en": "Nine practical experiments", "fa": "نُه آزمایش کاربردی"}, "body": {"en": "\n<p>Before each test, write the hypothesis, audience, variants, primary metric, guardrail, owner, observation window and decision rule. Use several matched topic pairs rather than declaring a winner from two posts. Alternate or randomize order when practical. Organic comparisons remain directional because audience exposure and timing are not controlled.</p>\n<ol><li><strong>Face versus no face:</strong> compare a relevant presenter plus headline against a diagram with the same promise. Keep brand treatment, topic family and CTA similar. Examine saves/sends per reach and qualified profile visits or leads.</li><li><strong>Specific versus generic cover:</strong> compare a category label with a concrete audience problem or outcome. Keep the layout stable. Measure useful actions rather than assuming a more dramatic headline is better.</li><li><strong>Caption depth:</strong> compare concise and expanded explanations, for example 60–100 versus 180–250 words. These are test brackets, not platform recommendations. Longer copy changes information depth as well as length.</li><li><strong>Hook:</strong> compare a concrete problem opening with a result/evidence-led opening. Use early video retention where available or goal-aligned post actions. Do not claim measured dwell time if it is not exposed.</li><li><strong>Format package:</strong> compare a carousel/document with a presenter-led video on similar topics. Measure production time per qualified outcome. This is not a single-variable visual experiment.</li><li><strong>Video duration:</strong> try concise 20–30-second versus explanatory 45–60-second treatments. These are starting brackets only. Consider watch time and conversion together; short videos can mechanically achieve higher completion.</li><li><strong>Time slot:</strong> balance two feasible audience-local slots across weekday, topic and format for several weeks. Record paid activity and unusual events.</li><li><strong>CTA:</strong> compare a useful save/checklist prompt, a relevant question and a specific inquiry/asset offer only within their intended funnel objective. More comments need not mean better leads.</li><li><strong>Proof or story:</strong> compare generic advice with a verified process demonstration or permissioned customer example. Evaluate relevance and qualified inquiries, not reach alone.</li></ol>\n<p>Instagram Trial Reels can help explore content with non-followers before wider sharing, where available. They are not randomized A/B tests and should not be directly compared with regular Reels distributed to followers. <a href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">Official Trial Reels explanation</a></p>\n<p>For stronger causal evidence in paid campaigns, use an authorized platform A/B test with controlled allocation and comparable targeting. Ordinary parallel ad sets are not automatically randomized experiments, and paid findings may not transfer to organic distribution. This guide does not authorize spending. <a href=\"https://www.linkedin.com/help/lms/answer/a529753\" target=\"_blank\" rel=\"noopener\">LinkedIn A/B testing</a></p>\n", "fa": "\n<p>پیش از هر آزمایش، فرضیه، مخاطب، نسخه‌ها، شاخص اصلی، شاخص محافظ، مسئول، بازه مشاهده و قاعده تصمیم را بنویسید. به‌جای اعلام برنده از روی دو پست، چند جفت موضوع هم‌تراز را بررسی کنید. در صورت امکان ترتیب را متناوب یا تصادفی کنید. مقایسه ارگانیک همچنان جهت‌نماست، چون مواجهه مخاطب و زمان کاملاً کنترل نمی‌شوند.</p>\n<ol><li><strong>چهره در برابر بدون چهره:</strong> ارائه‌دهنده مرتبط همراه تیتر را با نموداری دارای همان وعده مقایسه کنید. ظاهر برند، خانواده موضوع و دعوت به اقدام مشابه بماند. ذخیره/ارسال نسبت به ریچ و بازدید مرتبط پروفایل یا لید را بررسی کنید.</li><li><strong>کاور مشخص در برابر عمومی:</strong> عنوان یک دسته موضوعی را با مسئله یا نتیجه مشخص مخاطب مقایسه کنید. چیدمان ثابت بماند. اقدام مفید را اندازه بگیرید؛ فرض نکنید تیتر هیجانی‌تر بهتر است.</li><li><strong>عمق کپشن:</strong> توضیح کوتاه و مفصل را مقایسه کنید؛ برای مثال ۶۰ تا ۱۰۰ در برابر ۱۸۰ تا ۲۵۰ کلمه. این‌ها بازه آزمایش‌اند، نه توصیه پلتفرم. متن بلندتر علاوه بر طول، عمق اطلاعات را هم تغییر می‌دهد.</li><li><strong>هوک:</strong> شروع با مسئله مشخص را با شروع مبتنی بر نتیجه یا شواهد مقایسه کنید. از حفظ مخاطب در ابتدای ویدئو، اگر موجود است، یا اقدام متناسب با هدف پست استفاده کنید. اگر زمان مکث گزارش نمی‌شود، ادعای اندازه‌گیری آن نکنید.</li><li><strong>بسته قالب:</strong> کاروسل/سند را با ویدئوی ارائه‌دهنده در موضوع‌های مشابه مقایسه کنید. زمان تولید به‌ازای نتیجه واجدشرایط را بسنجید. این آزمایش بصری تک‌متغیره نیست.</li><li><strong>مدت ویدئو:</strong> نسخه کوتاه ۲۰ تا ۳۰ ثانیه‌ای را با نسخه توضیحی ۴۵ تا ۶۰ ثانیه‌ای امتحان کنید. این‌ها فقط بازه شروع‌اند. زمان تماشا و تبدیل را کنار هم ببینید؛ ویدئوی کوتاه ممکن است صرفاً به دلیل کوتاهی نرخ تکمیل بالاتری بگیرد.</li><li><strong>زمان انتشار:</strong> دو زمان عملی در منطقه زمانی مخاطب را طی چند هفته از نظر روز هفته، موضوع و قالب متوازن کنید. تبلیغ پولی و رویداد غیرعادی را ثبت کنید.</li><li><strong>دعوت به اقدام:</strong> درخواست مفید برای ذخیره/چک‌لیست، سؤال مرتبط و پیشنهاد مشخص برای دریافت اطلاعات یا فایل را فقط در چارچوب هدف قیف خودشان مقایسه کنید. کامنت بیشتر الزاماً به معنای لید بهتر نیست.</li><li><strong>اثبات یا روایت:</strong> توصیه عمومی را با نمایش فرایند قابل‌تأیید یا نمونه مشتری با اجازه مقایسه کنید. ارتباط با مخاطب و درخواست واجدشرایط را بسنجید، نه فقط ریچ.</li></ol>\n<p>Trial Reels اینستاگرام، در صورت دسترسی، امکان بررسی محتوا با غیرفالوئرها پیش از انتشار گسترده‌تر را می‌دهد. این قابلیت آزمایش تصادفی A/B نیست و نباید مستقیماً با ریلز عادی توزیع‌شده بین فالوئرها مقایسه شود. <a href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">توضیح رسمی Trial Reels</a></p>\n<p>برای شواهد علّی قوی‌تر در کمپین پولی، از آزمایش A/B مجاز پلتفرم با تخصیص کنترل‌شده و هدف‌گیری قابل‌مقایسه استفاده کنید. دو مجموعه تبلیغ عادی و موازی خودبه‌خود آزمایش تصادفی نیستند؛ نتیجه پولی نیز ممکن است به توزیع ارگانیک تعمیم نیابد. این راهنما مجوز هزینه‌کرد نیست. <a href=\"https://www.linkedin.com/help/lms/answer/a529753\" target=\"_blank\" rel=\"noopener\">آزمایش A/B در لینکدین</a></p>\n"}}, {"id": "measurement", "title": {"en": "Measure what success means", "fa": "آنچه واقعاً موفقیت است اندازه بگیرید"}, "body": {"en": "\n<p>Choose one primary outcome before reviewing results. An educational carousel intended to be saved and an offer intended to generate inquiries should not be ranked by one likes-based score. Use a consistent metric dictionary: name, definition, numerator, denominator, source, reporting window and limitations.</p>\n<ul><li><strong>Discovery:</strong> non-follower/out-of-network reach, relevant audience composition when available, profile visits and follows. Follower growth is context, not proof of business value.</li><li><strong>Useful engagement:</strong> saves, sends/shares and meaningful comments. State the denominator when calculating a rate. Engagement divided by followers is not the same measure as engagement divided by reach.</li><li><strong>Video:</strong> watch time, average watch time and retention/skip metrics where available. Average watch time divided by duration is not true completion rate; replays can push it above 100%.</li><li><strong>Business:</strong> tracked external clicks, engaged website sessions, qualified inquiries, meetings and attributable sales. Keep directly attributed, influenced, correlated and unknown outcomes separate.</li><li><strong>Guardrails:</strong> irrelevant audience growth, poor-quality leads, negative feedback, unfollows, production hours and total cost.</li></ul>\n<p>LinkedIn’s official member analytics define measures such as impressions, members reached and post-driven actions, with availability depending on account and content context. Read the applicable definitions rather than assuming that a similarly named metric means the same thing everywhere. Company Page analytics are a separate measurement context. <a href=\"https://www.linkedin.com/help/linkedin/answer/a516971\" target=\"_blank\" rel=\"noopener\">Member post analytics</a> · <a href=\"https://www.linkedin.com/help/linkedin/answer/a569074\" target=\"_blank\" rel=\"noopener\">Page analytics</a></p>\n<h3>Use fixed observation windows</h3>\n<p>Capture comparable posts at planned ages, for example 24 hours, 72 hours and 7 days, with a longer window for leads and sales. These checkpoints are practical choices, not universal statistical requirements. Keep missing data distinct from zero. Do not add cross-platform reach and call it unique people; audiences overlap and definitions differ.</p>\n<h3>Turn results into a learning record</h3>\n<p>For each test, record what changed, sample size, absolute outcomes, rates, variability, confounders, production cost and decision: continue, improve, repeat or retire. Retain supporting post URLs and a next-review date. Week 1 can establish baseline and codebook; week 2 can prepare variants; weeks 3–6 can run a small prioritized test set; later review can assess replication. This is a planning proposal, not a guarantee that eight weeks provides enough evidence.</p>\n<p><strong>A useful report answers:</strong> What did we test? Did it reach the right people? What useful actions followed? What remains uncertain? What will we change next, who owns it, and when will we review it?</p>\n", "fa": "\n<p>پیش از دیدن نتایج، یک پیامد اصلی انتخاب کنید. کاروسل آموزشی با هدف ذخیره‌شدن و پیشنهاد تجاری با هدف دریافت درخواست را نباید با یک امتیاز مبتنی بر لایک رتبه‌بندی کرد. فرهنگ شاخص یکدست داشته باشید: نام، تعریف، صورت، مخرج، منبع، بازه گزارش و محدودیت‌ها.</p>\n<ul><li><strong>کشف‌شدن:</strong> ریچ غیرفالوئر/خارج شبکه، ترکیب مخاطب مرتبط در صورت دسترسی، بازدید پروفایل و فالو. رشد فالوئر زمینه تحلیل است، نه اثبات ارزش تجاری.</li><li><strong>تعامل مفید:</strong> ذخیره، ارسال/اشتراک‌گذاری و کامنت معنادار. هنگام محاسبه نرخ، مخرج را مشخص کنید. تعامل تقسیم بر فالوئر با تعامل تقسیم بر ریچ یکی نیست.</li><li><strong>ویدئو:</strong> زمان تماشا، میانگین زمان تماشا و شاخص حفظ/ردکردن در صورت دسترسی. میانگین زمان تماشا تقسیم بر مدت ویدئو، نرخ تکمیل واقعی نیست؛ بازپخش می‌تواند آن را از ۱۰۰ درصد بالاتر ببرد.</li><li><strong>کسب‌وکار:</strong> کلیک خارجی رهگیری‌شده، نشست درگیر وب‌سایت، درخواست واجدشرایط، جلسه و فروش قابل‌انتساب. نتایج مستقیماً منتسب، تحت‌تأثیر، همبسته و نامشخص را جدا نگه دارید.</li><li><strong>شاخص‌های محافظ:</strong> رشد مخاطب نامرتبط، لید کم‌کیفیت، بازخورد منفی، آنفالو، ساعت تولید و هزینه کل.</li></ul>\n<p>آنالیتیکس رسمی اعضای لینکدین، شاخص‌هایی مانند نمایش، اعضای رسیده و اقدام‌های ناشی از پست را تعریف می‌کند؛ دسترسی به آن‌ها به حساب و نوع محتوا بستگی دارد. تعریف مربوط را بخوانید و فرض نکنید شاخص‌های هم‌نام در همه جا معنای یکسان دارند. آنالیتیکس صفحه شرکتی، زمینه اندازه‌گیری جداگانه‌ای است. <a href=\"https://www.linkedin.com/help/linkedin/answer/a516971\" target=\"_blank\" rel=\"noopener\">آنالیتیکس پست اعضا</a> · <a href=\"https://www.linkedin.com/help/linkedin/answer/a569074\" target=\"_blank\" rel=\"noopener\">آنالیتیکس صفحه</a></p>\n<h3>بازه مشاهده ثابت داشته باشید</h3>\n<p>پست‌های قابل‌مقایسه را در سن‌های ازپیش‌تعیین‌شده، مثلاً ۲۴ ساعت، ۷۲ ساعت و ۷ روز، ثبت کنید و برای لید و فروش بازه بلندتری در نظر بگیرید. این نقاط ثبت، انتخاب عملی‌اند نه الزام آماری همگانی. نبود داده را از صفر جدا کنید. ریچ چند پلتفرم را جمع نکنید و «افراد یکتا» ننامید؛ مخاطبان هم‌پوشانی دارند و تعریف‌ها متفاوت‌اند.</p>\n<h3>نتیجه را به سابقه یادگیری تبدیل کنید</h3>\n<p>برای هر آزمایش ثبت کنید چه چیزی تغییر کرد، تعداد نمونه چقدر بود، نتیجه مطلق و نرخ چه بود، پراکندگی، عوامل مخدوش‌کننده و هزینه تولید چه بودند و تصمیم چیست: ادامه، بهبود، تکرار یا کنارگذاشتن. لینک پست‌های پشتیبان و تاریخ بازبینی بعدی را نگه دارید. هفته اول می‌تواند به خط مبنا و راهنمای کدگذاری، هفته دوم به آماده‌کردن نسخه‌ها و هفته‌های ۳ تا ۶ به مجموعه کوچکی از آزمایش‌های اولویت‌دار اختصاص یابد؛ سپس تکرارپذیری ارزیابی شود. این پیشنهاد برنامه‌ریزی است، نه تضمین کفایت شواهد در هشت هفته.</p>\n<p><strong>گزارش مفید پاسخ می‌دهد:</strong> چه چیزی را آزمایش کردیم؟ آیا به افراد درست رسید؟ چه اقدام مفیدی پس از آن رخ داد؟ چه چیزی هنوز نامشخص است؟ دفعه بعد چه چیزی را تغییر می‌دهیم، مسئولش کیست و چه زمانی بازبینی می‌کنیم؟</p>\n"}}, {"id": "publishing", "title": {"en": "Publish, verify & learn", "fa": "انتشار، راستی‌آزمایی و یادگیری"}, "body": {"en": "<h2>Before publishing: a short quality gate</h2><ul><li><b>Audience and promise:</b> one clear audience, one useful promise, and a first frame or cover that matches the actual content.</li><li><b>Mobile check:</b> inspect the real asset on a phone-sized screen. Check text hierarchy, contrast, subtitles, alt text when supported and safe areas.</li><li><b>Truth and rights:</b> verify factual claims, permission to show people/client results, licenses and required disclosures. Inspiration is not permission to republish.</li><li><b>Release details:</b> correct account, current supported format, timezone, final approved version, tags, links and destination. Keep editable source files and exact exports.</li><li><b>Measurement:</b> assign post/campaign/experiment IDs, a primary KPI, observation windows and tracking parameters before release.</li></ul><p>For website destinations, consistent UTM campaign parameters help identify traffic in configured analytics. They do not by themselves prove causality, solve consent gaps or attribute every sale. <a class=\"ref\" href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">Google Analytics campaign URL guidance ↗</a></p><h2>After publishing</h2><ol><li>Verify the live post, media, links and actual timestamp. Scheduled is not published.</li><li>Capture results at preselected comparable ages, such as 24 hours, 72 hours and 7 days; these are proposed observation points, not platform rules.</li><li>Respond usefully within the team’s agreed community scope. Record recurring questions for future content.</li><li>Keep paid support, collaborations, major events and unusual distribution in the record.</li><li>Review business outcomes over a suitable longer window; distinguish unknown data from zero.</li></ol><h2>A suggested eight-week research rhythm</h2><div class=\"tablewrap\"><table><thead><tr><th>Period</th><th>Action</th><th>Output</th></tr></thead><tbody><tr><td>Week 1</td><td>Define objective, export baseline, sample peer content and write the codebook.</td><td>A consistent research table and known data gaps.</td></tr><tr><td>Week 2</td><td>Rank hypotheses and produce matched variants.</td><td>Approved experiment cards and assets.</td></tr><tr><td>Weeks 3–6</td><td>Run a small number of prioritized tests and check data quality.</td><td>Age-matched observations, not daily winner hunting.</td></tr><tr><td>Week 7</td><td>Assess replication, uncertainty and tradeoffs.</td><td>Continue, improve, retest or retire decisions.</td></tr><tr><td>Week 8 onward</td><td>Repeat on new topics and review assumptions when the audience or platform changes.</td><td>A living creative playbook with dates and exceptions.</td></tr></tbody></table></div><p class=\"note\">This cadence is a practical proposal, not a sample-size or statistical-power guarantee. Traffic, variation and the smallest useful effect determine how much evidence is needed.</p><h2>Close every report with a decision</h2><p>Report the objective, what was tested, sample and exposure, source and observation window, absolute outcomes and rates, limitations, relevant business results, and the next action with an owner and review date. A useful conclusion can be “inconclusive.”</p>", "fa": "<h2>پیش از انتشار: کنترل کیفیت کوتاه</h2><ul><li><b>مخاطب و وعده:</b> یک مخاطب روشن، یک وعده مفید و کاور یا فریم اول هماهنگ با محتوای واقعی.</li><li><b>بررسی موبایل:</b> فایل واقعی را در اندازه صفحه تلفن ببینید. سلسله‌مراتب متن، کنتراست، زیرنویس، متن جایگزین در صورت پشتیبانی و نواحی امن را بررسی کنید.</li><li><b>صحت و حقوق:</b> ادعاها، اجازه نمایش افراد و نتایج کلاینت، مجوزها و افشاهای لازم را بررسی کنید. الهام‌گرفتن مجوز بازنشر نیست.</li><li><b>جزئیات انتشار:</b> حساب درست، فرمت پشتیبانی‌شده فعلی، منطقه زمانی، نسخه نهایی تأییدشده، تگ‌ها، لینک‌ها و مقصد. فایل قابل‌ویرایش و خروجی دقیق را نگه دارید.</li><li><b>اندازه‌گیری:</b> پیش از انتشار شناسه پست/کمپین/آزمایش، KPI اصلی، پنجره مشاهده و پارامترهای رهگیری را مشخص کنید.</li></ul><p>برای مقصد وب‌سایت، پارامترهای یکسان UTM به شناسایی ترافیک در آنالیتیکسِ تنظیم‌شده کمک می‌کنند. به‌تنهایی علیت را ثابت نمی‌کنند، شکاف رضایت کاربر را رفع نمی‌کنند و همه فروش‌ها را منتسب نمی‌کنند. <a class=\"ref\" href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">راهنمای URL کمپین در Google Analytics ↗</a></p><h2>پس از انتشار</h2><ol><li>پست زنده، مدیا، لینک‌ها و زمان واقعی را بررسی کنید. زمان‌بندی‌شده به معنی منتشرشده نیست.</li><li>نتایج را در سن‌های ازپیش‌تعیین‌شده و قابل‌مقایسه، مثلاً ۲۴ ساعت، ۷۲ ساعت و ۷ روز ثبت کنید؛ این‌ها نقاط مشاهده پیشنهادی‌اند، نه قانون پلتفرم.</li><li>در محدوده توافق‌شده مدیریت جامعه پاسخ مفید بدهید. سؤال‌های تکراری را برای محتوای بعدی ثبت کنید.</li><li>حمایت پولی، همکاری‌ها، رویدادهای بزرگ و توزیع غیرعادی را در داده ثبت کنید.</li><li>نتایج تجاری را در پنجره بلندتر مناسب بررسی و داده نامعلوم را از صفر جدا کنید.</li></ol><h2>ریتم پیشنهادی هشت‌هفته‌ای تحقیق</h2><div class=\"tablewrap\"><table><thead><tr><th>بازه</th><th>اقدام</th><th>خروجی</th></tr></thead><tbody><tr><td>هفته ۱</td><td>هدف را تعیین کنید، خروجی خط مبنا بگیرید، محتوای همتایان را نمونه‌گیری و دفترچه کدگذاری را بنویسید.</td><td>جدول تحقیق یکدست و شکاف‌های داده مشخص.</td></tr><tr><td>هفته ۲</td><td>فرضیه‌ها را اولویت‌بندی و نسخه‌های قابل‌مقایسه را تولید کنید.</td><td>کارت آزمایش و فایل‌های تأییدشده.</td></tr><tr><td>هفته‌های ۳ تا ۶</td><td>تعداد محدودی تست اولویت‌دار اجرا و کیفیت داده را بررسی کنید.</td><td>مشاهدات هم‌سن، نه جست‌وجوی روزانه برای برنده.</td></tr><tr><td>هفته ۷</td><td>تکرارپذیری، عدم‌قطعیت و موازنه‌ها را بسنجید.</td><td>تصمیم ادامه، بهبود، تست مجدد یا توقف.</td></tr><tr><td>هفته ۸ به بعد</td><td>روی موضوعات جدید تکرار و هنگام تغییر مخاطب یا پلتفرم فرض‌ها را بازبینی کنید.</td><td>پلی‌بوک خلاقه زنده همراه تاریخ و استثناها.</td></tr></tbody></table></div><p class=\"note\">این زمان‌بندی پیشنهاد عملی است، نه تضمین حجم نمونه یا توان آماری. ترافیک، تغییرپذیری و کوچک‌ترین اثر مفید تعیین می‌کنند چه مقدار شواهد لازم است.</p><h2>هر گزارش را با یک تصمیم ببندید</h2><p>هدف، موضوع تست، نمونه و میزان دیده‌شدن، منبع و پنجره مشاهده، نتیجه مطلق و نرخ‌ها، محدودیت‌ها، نتیجه تجاری مرتبط و اقدام بعدی با مسئول و تاریخ بازبینی را گزارش کنید. «نامشخص» هم می‌تواند نتیجه‌ای مفید باشد.</p>"}}, {"id": "builder", "title": {"en": "Build an experiment card", "fa": "یک کارت آزمایش بسازید"}, "body": {"en": "<p>Choose a platform, objective and variable. This creates a starting brief, not a statistically powered design or an automated campaign. No information leaves this file.</p>", "fa": "<p>پلتفرم، هدف و متغیر را انتخاب کنید. این بخش بریف آغازین می‌سازد، نه طرح دارای توان آماری محاسبه‌شده یا کمپین خودکار. هیچ اطلاعاتی از این فایل ارسال نمی‌شود.</p>"}}, {"id": "sources", "title": {"en": "Sources & research limitations", "fa": "منابع و محدودیت‌های تحقیق"}, "body": {"en": "<p>Use the source nearest the claim, then read its date, population, platform surface and metric definitions. Official product explanations and observational studies answer different questions. This list is a curated starting library, not a systematic review of all research.</p><ol class=\"refs\"><li><a href=\"https://www.linkedin.com/blog/engineering/feed/engineering-the-next-generation-of-linkedins-feed\" target=\"_blank\" rel=\"noopener\">LinkedIn Engineering · 2026 feed architecture ↗</a><br><span class=\"note\">Official</span></li><li><a href=\"https://news.linkedin.com/2026/ImprovingTheFeed\" target=\"_blank\" rel=\"noopener\">LinkedIn · 2026 feed quality update ↗</a><br><span class=\"note\">Official</span></li><li><a href=\"https://about.fb.com/news/2023/06/how-ai-ranks-content-on-facebook-and-instagram/\" target=\"_blank\" rel=\"noopener\">Meta · ranking explanation, June 2023 ↗</a><br><span class=\"note\">Dated official explanation</span></li><li><a href=\"https://about.fb.com/news/2026/01/2026-ai-drives-performance/\" target=\"_blank\" rel=\"noopener\">Meta · original recommendations, January 2026 ↗</a><br><span class=\"note\">Official</span></li><li><a href=\"https://about.fb.com/news/2020/08/recommendation-guidelines/\" target=\"_blank\" rel=\"noopener\">Meta · recommendation eligibility, 2020 ↗</a><br><span class=\"note\">Foundational, not full current checklist</span></li><li><a href=\"https://ai.meta.com/tools/system-cards/instagram-feed-ranking/\" target=\"_blank\" rel=\"noopener\">Instagram Feed system card · February 2022 ↗</a><br><span class=\"note\">Historical architecture illustration</span></li><li><a href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">Meta · Trial Reels announcement, 2024 ↗</a><br><span class=\"note\">Official</span></li><li><a href=\"https://www.linkedin.com/help/linkedin/answer/a516971\" target=\"_blank\" rel=\"noopener\">LinkedIn · member post analytics ↗</a><br><span class=\"note\">Metric definitions</span></li><li><a href=\"https://www.linkedin.com/help/linkedin/answer/a569074\" target=\"_blank\" rel=\"noopener\">LinkedIn · Page analytics ↗</a><br><span class=\"note\">Metric definitions</span></li><li><a href=\"https://metricool.com/press-release-linkedin-study-2026/\" target=\"_blank\" rel=\"noopener\">Metricool · LinkedIn study, 2026 ↗</a><br><span class=\"note\">Observational benchmark</span></li><li><a href=\"https://metricool.com/wp-content/uploads/Linkedin-Study-2026-EN.pdf\" target=\"_blank\" rel=\"noopener\">Metricool · LinkedIn report and methodology ↗</a><br><span class=\"note\">Primary study report</span></li><li><a href=\"https://metricool.com/press-release-instagram-study-2026/\" target=\"_blank\" rel=\"noopener\">Metricool · Instagram study, 2026 ↗</a><br><span class=\"note\">Observational benchmark</span></li><li><a href=\"https://news.gatech.edu/news/2014/03/20/face-it-instagram-pictures-faces-are-more-popular\" target=\"_blank\" rel=\"noopener\">Georgia Tech · face-containing photos, 2014 ↗</a><br><span class=\"note\">Old observational research</span></li><li><a href=\"https://www.linkedin.com/business/marketing/blog/marketing-collective/pixels-and-promises\" target=\"_blank\" rel=\"noopener\">LinkedIn Creative Labs · B2B video ads ↗</a><br><span class=\"note\">Paid creative research, not organic proof</span></li><li><a href=\"https://www.linkedin.com/help/lms/answer/a529753\" target=\"_blank\" rel=\"noopener\">LinkedIn · A/B testing ↗</a><br><span class=\"note\">Official testing guidance</span></li><li><a href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">Google Analytics · campaign URLs ↗</a><br><span class=\"note\">Tracking guidance</span></li></ol><div class=\"callout\">Unknowns remain unknown: private competitor reach/saves/leads; exact ranking weights; the causal effect of a face, cover or word count on your audience. Refresh the evidence after material platform or audience changes.</div>", "fa": "<p>منبع نزدیک به ادعا را باز کنید، سپس تاریخ، جامعه مطالعه، سطح پلتفرم و تعریف شاخص‌ها را بخوانید. توضیح رسمی محصول و مطالعه مشاهده‌ای سؤال‌های متفاوتی را پاسخ می‌دهند. این فهرست کتابخانه آغازین گزینش‌شده است، نه مرور نظام‌مند تمام پژوهش‌ها.</p><ol class=\"refs\"><li><a href=\"https://www.linkedin.com/blog/engineering/feed/engineering-the-next-generation-of-linkedins-feed\" target=\"_blank\" rel=\"noopener\">مهندسی LinkedIn · معماری فید ۲۰۲۶ ↗</a><br><span class=\"note\">رسمی</span></li><li><a href=\"https://news.linkedin.com/2026/ImprovingTheFeed\" target=\"_blank\" rel=\"noopener\">LinkedIn · به‌روزرسانی کیفیت فید ۲۰۲۶ ↗</a><br><span class=\"note\">رسمی</span></li><li><a href=\"https://about.fb.com/news/2023/06/how-ai-ranks-content-on-facebook-and-instagram/\" target=\"_blank\" rel=\"noopener\">متا · توضیح رتبه‌بندی، ژوئن ۲۰۲۳ ↗</a><br><span class=\"note\">توضیح رسمی تاریخ‌دار</span></li><li><a href=\"https://about.fb.com/news/2026/01/2026-ai-drives-performance/\" target=\"_blank\" rel=\"noopener\">متا · پیشنهادهای اصیل، ژانویه ۲۰۲۶ ↗</a><br><span class=\"note\">رسمی</span></li><li><a href=\"https://about.fb.com/news/2020/08/recommendation-guidelines/\" target=\"_blank\" rel=\"noopener\">متا · واجدشرایط‌بودن پیشنهاد، ۲۰۲۰ ↗</a><br><span class=\"note\">پایه‌ای، نه فهرست کامل فعلی</span></li><li><a href=\"https://ai.meta.com/tools/system-cards/instagram-feed-ranking/\" target=\"_blank\" rel=\"noopener\">کارت سیستم فید Instagram · فوریه ۲۰۲۲ ↗</a><br><span class=\"note\">تصویرسازی تاریخی معماری</span></li><li><a href=\"https://about.fb.com/news/2024/12/trial-reels-try-content-non-followers-first-see-what-perfoms-best/\" target=\"_blank\" rel=\"noopener\">متا · معرفی Trial Reels، ۲۰۲۴ ↗</a><br><span class=\"note\">رسمی</span></li><li><a href=\"https://www.linkedin.com/help/linkedin/answer/a516971\" target=\"_blank\" rel=\"noopener\">LinkedIn · آنالیتیکس پست اعضا ↗</a><br><span class=\"note\">تعاریف شاخص‌ها</span></li><li><a href=\"https://www.linkedin.com/help/linkedin/answer/a569074\" target=\"_blank\" rel=\"noopener\">LinkedIn · آنالیتیکس صفحه ↗</a><br><span class=\"note\">تعاریف شاخص‌ها</span></li><li><a href=\"https://metricool.com/press-release-linkedin-study-2026/\" target=\"_blank\" rel=\"noopener\">Metricool · مطالعه LinkedIn، ۲۰۲۶ ↗</a><br><span class=\"note\">بنچمارک مشاهده‌ای</span></li><li><a href=\"https://metricool.com/wp-content/uploads/Linkedin-Study-2026-EN.pdf\" target=\"_blank\" rel=\"noopener\">Metricool · گزارش و روش‌شناسی LinkedIn ↗</a><br><span class=\"note\">گزارش اصلی مطالعه</span></li><li><a href=\"https://metricool.com/press-release-instagram-study-2026/\" target=\"_blank\" rel=\"noopener\">Metricool · مطالعه Instagram، ۲۰۲۶ ↗</a><br><span class=\"note\">بنچمارک مشاهده‌ای</span></li><li><a href=\"https://news.gatech.edu/news/2014/03/20/face-it-instagram-pictures-faces-are-more-popular\" target=\"_blank\" rel=\"noopener\">Georgia Tech · عکس‌های دارای چهره، ۲۰۱۴ ↗</a><br><span class=\"note\">تحقیق مشاهده‌ای قدیمی</span></li><li><a href=\"https://www.linkedin.com/business/marketing/blog/marketing-collective/pixels-and-promises\" target=\"_blank\" rel=\"noopener\">LinkedIn Creative Labs · تبلیغات ویدئویی B2B ↗</a><br><span class=\"note\">تحقیق تبلیغاتی، نه اثبات ارگانیک</span></li><li><a href=\"https://www.linkedin.com/help/lms/answer/a529753\" target=\"_blank\" rel=\"noopener\">LinkedIn · آزمایش A/B ↗</a><br><span class=\"note\">راهنمای رسمی آزمایش</span></li><li><a href=\"https://support.google.com/analytics/answer/10917952\" target=\"_blank\" rel=\"noopener\">Google Analytics · لینک‌های کمپین ↗</a><br><span class=\"note\">راهنمای رهگیری</span></li></ol><div class=\"callout\">نامعلوم‌ها نامعلوم می‌مانند: ریچ/ذخیره/لید خصوصی رقبا، وزن دقیق رتبه‌بندی و اثر علّی چهره، کاور یا تعداد کلمه بر مخاطب شما. پس از تغییر مهم پلتفرم یا مخاطب، شواهد را به‌روز کنید.</div>"}}];

let card={platform:'LinkedIn',goal:'value',test:'face'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tr(key){return ui[lang][key]}
function navigate(id){if(!chapters.some(x=>x.id===id))id='start';page=id;location.hash=id;render();document.getElementById('shell').classList.remove('menu-open');window.scrollTo(0,0)}
function setLanguage(value){lang=value;try{localStorage.setItem('jml-research-guide-lang',value)}catch(e){}render()}
function saveFile(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const toast=document.getElementById('toast');toast.textContent=tr('sent');toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2400)}
function downloadHTML(){saveFile('JML-Post-Effectiveness-Research-FA-EN.html','<!doctype html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8')}
function downloadCSV(){const cols=['platform','account','account_type','post_url','post_id','published_at','audience_timezone','captured_at','post_age_hours','objective','audience','topic','format','paid_organic_unknown','face_present','face_type','cover_title_words','hook_type','caption_words','caption_characters','video_seconds','slide_count','cta_type','collaboration','metric_source','reach','impressions','saves','sends_shares','meaningful_comments','profile_visits','external_clicks','qualified_leads','production_hours','experiment_id','variant','limitations','decision','next_review'];saveFile('post-research-template.csv','\uFEFF'+cols.join(',')+'\r\n','text/csv;charset=utf-8')}
function builder(){return `<div class="form-grid"><div><label class="field" for="platform">${tr('platform')}</label><select id="platform" onchange="card.platform=this.value;updateCard()"><option ${card.platform==='LinkedIn'?'selected':''}>LinkedIn</option><option ${card.platform==='Instagram'?'selected':''}>Instagram</option></select></div><div><label class="field" for="goal">${tr('objective')}</label><select id="goal" onchange="card.goal=this.value;updateCard()">${Object.keys(goals).map(k=>`<option value="${k}" ${card.goal===k?'selected':''}>${goals[k][lang]}</option>`).join('')}</select></div><div><label class="field" for="test">${tr('variable')}</label><select id="test" onchange="card.test=this.value;updateCard()">${Object.keys(tests).map(k=>`<option value="${k}" ${card.test===k?'selected':''}>${tests[k][lang]}</option>`).join('')}</select></div></div><div id="experimentOutput" class="output" aria-live="polite">${cardHTML()}</div><button class="primary" onclick="downloadCard()">${tr('export')}</button><p class="note">${tr('notice')}</p>`}

function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.title=lang==='fa'?'JML | راهنمای تحقیق اثربخشی پست':'JML | Post Effectiveness Research Guide';document.getElementById('nav').innerHTML=chapters.map((c,i)=>`<button class="${c.id===page?'active':''}" onclick="navigate('${c.id}')">${String(i+1).padStart(2,'0')} · ${c.title[lang]}</button>`).join('');document.getElementById('side-note').textContent=tr('footer');document.getElementById('top-title').textContent=tr('subtitle');document.getElementById('edition').textContent=tr('edition');document.getElementById('menuButton').textContent=tr('menu');document.getElementById('closeMenu').textContent=tr('close');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));const c=chapters.find(x=>x.id===page)||chapters[0],i=chapters.indexOf(c);document.getElementById('main').innerHTML=`<div class="eyebrow">JML / RESEARCH FIELD GUIDE</div><h1>${c.title[lang]}</h1><div class="toolbar"><button onclick="downloadHTML()">${tr('download')}</button><button onclick="downloadCSV()">${tr('csv')}</button><button onclick="window.print()">${tr('print')}</button></div>${c.body[lang]}${page==='builder'?builder():''}<div class="chapter-nav">${i>0?`<button onclick="navigate('${chapters[i-1].id}')">${tr('prev')}: ${chapters[i-1].title[lang]}</button>`:'<span></span>'}${i<chapters.length-1?`<button class="primary" onclick="navigate('${chapters[i+1].id}')">${tr('next')}: ${chapters[i+1].title[lang]}</button>`:''}</div><div class="footer">${tr('footer')}<br>${tr('details')}</div>`}
